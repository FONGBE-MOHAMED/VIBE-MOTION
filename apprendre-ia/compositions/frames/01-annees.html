            <div id="f01-kb" class="f01-grp" style="left:-120px;top:500px;width:560px;height:380px">
              <div class="abs fg-blur" style="left:60px;top:60px;width:420px;height:240px;border-radius:18px;background:linear-gradient(180deg,#d9d2c3,#a9a190);transform:rotate(-8deg)"></div>
            </div>

    <!-- the voice line, bottom centre, word by word (frame-local cues) -->
    <div id="f01-subs" class="clip f01-layer" data-start="0" data-duration="6.37" data-track-index="2">
      <div class="sub dark"><span id="f01-s1" class="f01-line"><span class="w f01-w" data-cue="0.05">Deux</span> <span class="w f01-w" data-cue="0.32">mille.</span> <span class="w f01-w" data-cue="1.02">Un</span> <span class="f01-hl"><i id="f01-hl1" class="f01-hlbg"></i><span id="f01-wsite" class="w f01-w f01-in" data-cue="1.20">site</span> <span id="f01-wnet" class="w f01-w f01-in" data-cue="1.38">internet</span></span> <span class="w f01-w" data-cue="1.50">?</span> <span class="w f01-w" data-cue="2.21">Pas</span> <span class="w f01-w" data-cue="2.39">pour</span> <span class="w f01-w" data-cue="2.56">moi.</span></span></div>
      <div class="sub dark"><span id="f01-s2" class="f01-line"><span class="w f01-w" data-cue="3.22">Deux</span> <span class="w f01-w" data-cue="3.46">mille</span> <span class="w f01-w" data-cue="3.70">dix.</span></span></div>
      <div class="sub dark"><span id="f01-s3" class="f01-line"><span class="w f01-w" data-cue="4.39">Les</span> <span class="f01-hl"><i id="f01-hl2" class="f01-hlbg"></i><span id="f01-wres" class="w f01-w f01-in" data-cue="4.56">réseaux</span> <span id="f01-wsoc" class="w f01-w f01-in" data-cue="4.85">sociaux</span></span> <span class="w f01-w" data-cue="5.00">?</span> <span class="w f01-w" data-cue="5.61">Pas</span> <span class="w f01-w" data-cue="5.78">pour</span> <span class="w f01-w" data-cue="5.95">moi.</span></span></div>

    <div id="f01-grain" class="clip grain" data-start="0" data-duration="6.37" data-track-index="3"></div>

  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "01-annees";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(n) { return root.querySelector("#f01-" + n); }
      var DUR = 6.37, EARLY = 1 / 30;

      /* ---- world and camera constants ---- */
      var ST2010 = 2220;                       // station 2010, world x (2000 sits at 960 ; the line at y 770)
      var DRIFT = 18;                          // camera drift, px/s toward the right, the whole frame
      var PUSH = 0.02;                         // scene 1 push, scale per second, around (960, 500)
      var W1 = 2.78, W1P = 2.98, W1E = 3.14;   // whip 2000 -> 2010 : power2.in to the blur peak, expo.out landing
      var W2 = 6.05;                           // whip toward 2026 ; the seam (6.37) is its blur peak
      var V_SEAM = 9000;                       // px/s at 6.37 (handoff_out)
      var KEY2 = 5.80, VX = 40;                // the blurred 2000 screen slides out by the left, 40 px/s faster than the drift
      var KF = 1.5;                            // the foreground keyboard moves 2.5x the world
      var aIn = 2 / (W1P - W1), bOut = 10 * Math.LN2 / (W1E - W1P);
      var SPLIT = bOut / (aIn + bOut);         // share of the whip run done in the power2.in leg (speeds match at 2.98)
      var X1 = 960 - ST2010 + DRIFT * W1E;     // world x at landing : the phone centred while the drift keeps running
      var D2 = (V_SEAM - DRIFT) * (DUR - W2) / 2;  // power2.in run of the last whip (end speed + drift = 9000 px/s)
      var S1 = 1 + PUSH * W1;

      /* ---- render : the camera blur (directional, per object, never on a layer wider than 1800 px) ---- */
      var V = { mb: 0 };
      var mbNode = $("mbg");
      var STREAK = [$("mk1"), $("crtg"), $("kb"), $("mk2"), $("phg")];
      var dots = $("dots"), dotsMb = $("dotsmb");
      function render() {
        var b = Math.max(0, V.mb);
        mbNode.setAttribute("stdDeviation", b.toFixed(2) + " 0");
        var f = b > 0.25 ? "url(#f01-mb)" : "none";
        for (var i = 0; i < STREAK.length; i++) STREAK[i].style.filter = f;
        var k = Math.min(1, b / 12);
        dots.style.opacity = (1 - 0.9 * k).toFixed(3);
        dotsMb.style.opacity = k.toFixed(3);
      }

      /* ===================== the one paused timeline ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- camera track (apart from the objects) ---- */
      var CAM = gsap.timeline();
      function ct(target, from, to, pos) { if (pos > 0) to.immediateRender = false; CAM.fromTo(target, from, to, pos); }
      var drift = $("drift"), world = $("world"), fg = $("fg"), crtg = $("crtg");
      gsap.set(drift, { transformOrigin: "960px 500px" });
      gsap.set($("cam"), { transformOrigin: "960px 540px" });
      // drift x +18 px/s, never stops
      ct(drift, { x: 0 }, { x: -DRIFT * DUR, duration: DUR, ease: "none" }, 0);
      // push 2 %/s around (960, 500), handed back under the whip with the same speed profile as the whip
      ct(drift, { scale: 1 }, { scale: S1, duration: W1, ease: "none" }, 0);
      ct(drift, { scale: S1 }, { scale: S1 - (S1 - 1) * SPLIT, duration: W1P - W1, ease: "power2.in" }, W1);
      ct(drift, { scale: S1 - (S1 - 1) * SPLIT }, { scale: 1, duration: W1E - W1P, ease: "expo.out" }, W1P);
      // 2.78 -> 2.98 whip toward the right (power2.in), 2.98 -> 3.14 landing on the 2010 phone (expo.out)
      ct(world, { x: 0 }, { x: X1 * SPLIT, duration: W1P - W1, ease: "power2.in" }, W1);
      ct(world, { x: X1 * SPLIT }, { x: X1, duration: W1E - W1P, ease: "expo.out" }, W1P);
      // 6.05 -> 6.37 whip toward the right, the seam at full speed
      ct(world, { x: X1 }, { x: X1 - D2, duration: DUR - W2, ease: "power2.in" }, W2);
      // blur envelopes : 0 -> 14 -> 0 (whip 1), 0 -> 16 (whip 2, seam)
      ct(V, { mb: 0 }, { mb: 14, duration: W1P - W1, ease: "power2.in" }, W1);
      ct(V, { mb: 14 }, { mb: 0, duration: W1E - W1P, ease: "expo.out" }, W1P);
      ct(V, { mb: 0 }, { mb: 16, duration: DUR - W2, ease: "power2.in" }, W2);
      // foreground keyboard : parallax 2.5x (drift, then the whip throws it out by the left)
      var fg0 = -KF * DRIFT * W1;
      ct(fg, { x: 0 }, { x: fg0, duration: W1, ease: "none" }, 0);
      ct(fg, { x: fg0 }, { x: fg0 + (1 + KF) * X1 * SPLIT, duration: W1P - W1, ease: "power2.in" }, W1);
      ct(fg, { x: fg0 + (1 + KF) * X1 * SPLIT }, { x: fg0 + (1 + KF) * X1, duration: W1E - W1P, ease: "expo.out" }, W1P);
      // the 2000 screen, out of focus : the whip carries it less far (it trails at the left edge), then it slides out
      // by the left, VX px/s faster than the drift ; keyed on the 5.80 key image (its left edge at x -420 on screen)
      var c58 = -420 - 660 - X1 + DRIFT * KEY2;
      var c1 = c58 + VX * (KEY2 - W1E), c3 = c1 - VX * (DUR - W1E);
      ct(crtg, { x: 0 }, { x: c1 * SPLIT, duration: W1P - W1, ease: "power2.in" }, W1);
      ct(crtg, { x: c1 * SPLIT }, { x: c1, duration: W1E - W1P, ease: "expo.out" }, W1P);
      ct(crtg, { x: c1 }, { x: c3, duration: DUR - W1E, ease: "none" }, W1E);
      tl.add(CAM, 0);

      /* ---- scene 1 (0.00 -> 2.98) : 2000 ---- */
      // 0.00 the CRT lands on the line above « 2000 » (x1.15, blur 8 -> sharp, 0.12 s expo.out), contact shadow
      ft($("crt"), { scale: 1.15, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0);
      ft($("crtsh"), { opacity: 0, scaleX: 1.15 }, { opacity: 1, scaleX: 1, duration: 0.12, ease: "expo.out" }, 0);
      // 0.30 the screen powers on : glow 0.1 s, one scan sweep, the LED lights
      ft($("off"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out" }, 0.30);
      ft($("glow"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "power2.out" }, 0.30);
      ft($("glow"), { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in" }, 0.33);
      ft($("scan"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.30);
      ft($("scan"), { y: -90 }, { y: 372, duration: 0.42, ease: "power1.in" }, 0.30);
      ft($("scan"), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, 0.64);
      ft($("led"), { opacity: 0.25 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.30);
      // 0.70 the era pointer crosses the screen (one curved move : x and y on two curves)
      var ptr = $("ptr"), TX = 2, TY = 1.5;          // arrow tip inside the 24 x 32 svg
      var P0 = [536, 352], P1 = [112, 292], OUI = [262, 203];
      ft(ptr, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.70);
      ft(ptr, { x: P0[0] - TX }, { x: P1[0] - TX, duration: 0.45, ease: "power3.out" }, 0.70);
      ft(ptr, { y: P0[1] - TY }, { y: P1[1] - TY, duration: 0.45, ease: "power2.out" }, 0.70);
      // 0.95 the « Assistant » window opens (x0.9 -> 1 in 0.1 s), 0.07 s before « Un »
      ft($("win"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.1, ease: "expo.out" }, 0.95);
      // 1.40 « Oui » blinks once
      ft($("ouihl"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 1.40);
      ft($("ouihl"), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in" }, 1.50);
      // 1.42 -> 1.80 the pointer comes to rest on « Oui » (one curved move)
      ft(ptr, { x: P1[0] - TX }, { x: OUI[0] - TX, duration: 0.38, ease: "power3.out" }, 1.42);
      ft(ptr, { y: P1[1] - TY }, { y: OUI[1] - TY, duration: 0.38, ease: "power2.out" }, 1.42);
      // 2.12 THE POST-IT comes from the camera (x1.6, blur 10, -14 deg -> -7 deg) and slaps over the window, 0.09 s before « Pas »
      var pi1 = $("pi1");
      ft(pi1, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 2.12);
      ft(pi1, { scale: 1.6, rotation: -14, x: 110, y: 80, filter: "blur(10px)" },
        { scale: 1, rotation: -7, x: 0, y: 0, filter: "blur(0.6px)", duration: 0.12, ease: "expo.out" }, 2.12);
      ft(pi1, { scale: 1 }, { scale: 1.03, duration: 0.08, ease: "power2.out" }, 2.24);   // the slap : 0.97 -> 1
      // 2.56 « moi » : its bottom-right corner lifts by 3 deg (life)
      gsap.set($("pi1c"), { transformOrigin: "100% 100%" });
      ft($("pi1c"), { scale: 1, rotation: 0 }, { scale: 1.3, rotation: -3, duration: 0.3, ease: "power2.out" }, 2.56);
      // during the whip : the 2000 screen falls out of focus (rack focus) ; the post-it leaves it under the smear
      ft($("crtdof"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0.5, filter: "blur(18px)", duration: 0.34, ease: "power2.inOut" }, 2.80);
      ft(pi1, { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in" }, 2.92);
      // the 2010 station exists from here (still out of frame on the right)
      ft([$("phg"), $("mk2")], { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.80);

      /* ---- scene 2 (2.98 -> 6.37) : 2010 ---- */
      // 3.22 « Deux mille dix » : « 2010 » lights up (grey -> white, 0.1 s)
      ft($("y2010"), { color: "rgba(201,198,191,0.35)" }, { color: "#f3f1ec", duration: 0.1, ease: "power1.out" }, 3.22);
      // 3.60 the phone screen wakes (glow, icon grid)
      ft($("poff"), { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 3.60);
      ft($("pglow"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "power2.out" }, 3.60);
      ft($("pglow"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in" }, 3.66);
      Array.prototype.forEach.call($("grid").querySelectorAll("i"), function (ic, i) {
        ft(ic, { opacity: 0, scale: 0.6 }, { opacity: 0.75, scale: 1, duration: 0.14, ease: "power3.out" }, 3.64 + i * 0.025);
      });
      // 4.30 the notification and its button drop from the top of the screen (y -40 -> 0, 0.12 s), 0.09 s before « Les »
      ft($("notif"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.12, ease: "expo.out" }, 4.30);
      // 4.85 « sociaux » : the button pulses once
      ft($("btn"), { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out" }, 4.85);
      ft($("btn"), { scale: 1.1 }, { scale: 1, duration: 0.16, ease: "power2.inOut" }, 4.95);
      // 5.50 the post-it comes from the camera and slaps on the phone, wider than it (14 deg -> 6 deg), 0.11 s before « Pas »
      var pi2 = $("pi2");
      ft(pi2, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 5.50);
      ft(pi2, { scale: 1.6, rotation: 14, x: -110, y: 80, filter: "blur(10px)" },
        { scale: 1, rotation: 6, x: 0, y: 0, filter: "blur(0.5px)", duration: 0.12, ease: "expo.out" }, 5.50);
      ft(pi2, { scale: 1 }, { scale: 1.02, duration: 0.08, ease: "power2.out" }, 5.62);

      /* ---- the voice line : word by word, grey then ink ; one highlighter per sentence ---- */
      var GREY = "rgba(243,241,236,0.35)", INK = "#f3f1ec", DARK = "#17181c";
      Array.prototype.forEach.call(root.querySelectorAll(".f01-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue"));
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, Math.max(0.001, cue - EARLY));
        if (!w.classList.contains("f01-in")) ft(w, { color: GREY }, { color: INK, duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      // [boîte : site internet] traced at 1.18 ; the words turn to ink #17181c as the yellow passes
      ft($("hl1"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.18);
      ft($("wsite"), { color: INK }, { color: DARK, duration: 0.1, ease: "none" }, 1.19);
      ft($("wnet"), { color: INK }, { color: DARK, duration: 0.1, ease: "none" }, 1.25);
      // [boîte : réseaux sociaux] traced at 4.54
      ft($("hl2"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out" }, 4.54);
      ft($("wres"), { color: INK }, { color: DARK, duration: 0.1, ease: "none" }, 4.55);
      ft($("wsoc"), { color: INK }, { color: DARK, duration: 0.1, ease: "none" }, 4.62);
      // each sentence leaves (opacity 1 -> 0, blur 0 -> 6 px, 0.14 s) : with the whip, in the silence, before the seam
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.80);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.18);
      ft($("s3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.98);

      // exact frame length
      tl.set({}, {}, DUR);

      // first image = handoff_in, before any seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
