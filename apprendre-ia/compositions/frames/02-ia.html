            <div id="f02-cutext" class="abs"><span id="f02-cuph">Écris ta demande…</span><span id="f02-cutyped"></span><span id="f02-cucaret" class="caret" style="height:110px;width:7px;margin:0 6px 0 22px"></span><span id="f02-cumoi">moi.</span><span id="f02-cutab" class="abs" style="left:810px;top:178px;padding:8px 16px;border:2px solid rgba(243,241,236,.3);border-radius:10px;font:700 24px/1 Space Mono;color:rgba(243,241,236,.55);letter-spacing:.1em">TAB</span></div>
            <div id="f02-cusend" class="send" style="left:1598px;top:397px;width:120px;height:120px;border-radius:28px"><svg width="56" height="56" viewBox="0 0 30 30"><path d="M15 24 V7 M8 13 L15 6 L22 13" stroke="#17181c" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <div class="abs fg-blur f02-band" style="left:-60px;top:-60px;width:1070px;height:110px;background:#2a2d33"></div>
          <div class="abs fg-blur f02-band" style="left:910px;top:-60px;width:1070px;height:110px;background:#2a2d33"></div>
          <div class="abs fg-blur f02-band" style="left:-60px;top:-40px;width:120px;height:1200px;background:#2a2d33"></div>

      <div id="f02-sub1" class="sub dark"><span id="f02-w1" class="w f02-sw">Deux</span> <span id="f02-w2" class="w f02-sw">mille</span> <span id="f02-w3" class="w f02-sw">vingt-six.</span></div>
      <div id="f02-sub2" class="sub dark"><span class="f02-kwa"><i id="f02-box1" class="f02-kwbox"></i><span id="f02-w4" class="w f02-sw f02-kw"><span id="f02-w4l" class="f02-lt">L’intelligence</span><span id="f02-w4d" class="f02-dk">L’intelligence</span></span></span> <span class="f02-kwa"><i id="f02-box2" class="f02-kwbox f02-ext"></i><span id="f02-w5" class="w f02-sw f02-kw"><span id="f02-w5l" class="f02-lt">artificielle</span><span id="f02-w5d" class="f02-dk">artificielle</span></span></span> <span id="f02-w6" class="w f02-sw">?</span></div>

  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "02-ia";
      var DUR = 5.03;
      var tl = gsap.timeline({ paused: true });

      /* ---------- géométrie, écrite en dur (cadre fixe 1920×1080) ---------- */
      // Le champ du portable tel que P03 le dessine (portable ×0,98, pied centré en 960, 770), caméra au repos.
      var WF = { cy: 595.56, w: 842.8, h: 90.16, tx: 565.06, fs: 27.44, sx: 1335.34, ss: 58.8 };
      // Le même champ dans le gros plan P04.
      var CF = { cy: 455, w: 1600, h: 250, tx: 232, fs: 100, sx: 1658, sy: 457, ss: 120 };
      // Pose des pièces du gros plan (cadre, texte, envoi) qui recouvre le champ du monde vu par la caméra
      // (échelle S, translation verticale du monde ty) ; dx compense la dérive du gros plan.
      function pose(S, ty, dx) {
        var fy = 540 + S * (WF.cy + ty - 540);
        return {
          box: { x: dx, y: fy - CF.cy, scaleX: WF.w * S / CF.w, scaleY: WF.h * S / CF.h },
          txt: { x: dx + 960 + S * (WF.tx - 960) - CF.tx, y: fy - CF.cy, scale: WF.fs * S / CF.fs },
          snd: { x: dx + 960 + S * (WF.sx - 960) - CF.sx, y: fy - CF.sy, scale: WF.ss * S / CF.ss }
        };
      }

      var X_WHIP = 960 - 2850;              // en plein whip, entre 2010 (2220) et 2026 (3480)
      var X_2026 = 960 - 3480;              // posé sur le portable de 2026
      var Y_PUSH = 11.7;                    // poussée ×1,08 : le centre de l'écran (y 381,7) reste en place
      var Y_FIELD = 540 - WF.cy;            // le champ au centre du cadre
      var S_CUT1 = 1.74, Y_CUT1 = (Y_PUSH + Y_FIELD) / 2;      // milieu du cran (expo.inOut, p = 0,5) à 2.92
      var S_CUT2 = 2.4 - 1.2 * Math.pow(0.09 / 0.2, 2);        // recul (power2.in) à 4.92
      var P1 = pose(S_CUT1, Y_CUT1, 0);
      var P2 = pose(S_CUT2, Y_FIELD, 20);

      /* ---------- piste caméra : le monde ---------- */
      // 0.00 à 0.18 : le whip se pose sur le portable de 2026 (expo.out), flou 16 → 0
      tl.fromTo("#f02-world", { x: X_WHIP, y: 0 }, { x: X_2026, y: 0, duration: 0.18, ease: "expo.out" }, 0);
      tl.fromTo("#f02-view", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0);
      // 0.18 à 2.81 : poussée linéaire ×1 → ×1,08 vers l'écran
      tl.fromTo("#f02-cam", { scale: 1 }, { scale: 1.08, duration: 2.63, ease: "none", immediateRender: false }, 0.18);
      tl.fromTo("#f02-world", { x: X_2026, y: 0 }, { x: X_2026, y: Y_PUSH, duration: 2.63, ease: "none", immediateRender: false }, 0.18);
      // 2.81 à 3.03 : cran ×1,08 → ×2,4 sur le champ (expo.inOut), flou 8 au sommet ; coupe dans l'axe à 2.92
      tl.fromTo("#f02-cam", { scale: 1.08 }, { scale: 2.4, duration: 0.22, ease: "expo.inOut", immediateRender: false }, 2.81);
      tl.fromTo("#f02-world", { x: X_2026, y: Y_PUSH }, { x: X_2026, y: Y_FIELD, duration: 0.22, ease: "expo.inOut", immediateRender: false }, 2.81);
      tl.fromTo("#f02-view", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.11, ease: "power2.in", immediateRender: false }, 2.81);
      // 4.83 à 5.03 : recul ×2,4 → ×1,2 (power2.in), flou 0 → 14 ; le monde repasse devant à 4.92
      tl.fromTo("#f02-cam", { scale: 2.4 }, { scale: 1.2, duration: 0.2, ease: "power2.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-view", { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.2, ease: "none", immediateRender: false }, 4.83);
      tl.set("#f02-view", { zIndex: 4 }, 4.92);

      /* ---------- piste caméra : le gros plan ---------- */
      // 2.92 : au sommet du flou, le gros plan prend le relais ; ses pièces partent de la pose du champ vu par la caméra
      tl.set("#f02-cu", { opacity: 1 }, 2.92);
      tl.fromTo("#f02-cu", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.11, ease: "power2.out", immediateRender: false }, 2.92);
      tl.fromTo("#f02-cubox", P1.box, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.11, ease: "expo.out", immediateRender: false }, 2.92);
      tl.fromTo("#f02-cutext", P1.txt, { x: 0, y: 0, scale: 1, duration: 0.11, ease: "expo.out", immediateRender: false }, 2.92);
      tl.fromTo("#f02-cusend", P1.snd, { x: 0, y: 0, scale: 1, duration: 0.11, ease: "expo.out", immediateRender: false }, 2.92);
      tl.fromTo("#f02-cuhello", { opacity: 0 }, { opacity: 0.55, duration: 0.16, ease: "power1.out", immediateRender: false }, 2.95);
      tl.fromTo(".f02-band", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, 2.92);
      // dérive x -10 px/s
      tl.fromTo("#f02-cudrift", { x: 0 }, { x: -20, duration: 2.0, ease: "none", immediateRender: false }, 2.92);
      // 3.93 à 4.05 : micro-cran ×1,05 vers « moi. »
      tl.fromTo("#f02-cumicro", { scale: 1 }, { scale: 1.05, duration: 0.12, ease: "expo.inOut", immediateRender: false }, 3.93);
      // 4.83 : départ du recul ; les pièces rejoignent la pose du champ du monde à 4.92 (coupe dans l'axe)
      tl.fromTo("#f02-cumicro", { scale: 1.05 }, { scale: 1, duration: 0.09, ease: "power2.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cubox", { x: 0, y: 0, scaleX: 1, scaleY: 1 }, { x: P2.box.x, y: P2.box.y, scaleX: P2.box.scaleX, scaleY: P2.box.scaleY, duration: 0.09, ease: "power2.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cutext", { x: 0, y: 0, scale: 1 }, { x: P2.txt.x, y: P2.txt.y, scale: P2.txt.scale, duration: 0.09, ease: "power2.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cusend", { x: 0, y: 0, scale: 1 }, { x: P2.snd.x, y: P2.snd.y, scale: P2.snd.scale, duration: 0.09, ease: "power2.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cu", { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.2, ease: "none", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cuhello", { opacity: 0.55 }, { opacity: 0, duration: 0.07, ease: "power1.in", immediateRender: false }, 4.83);
      tl.fromTo(".f02-band", { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in", immediateRender: false }, 4.83);
      tl.fromTo("#f02-cutab", { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in", immediateRender: false }, 4.83);

      /* ---------- scène 1 : 2026 ---------- */
      // la tasse traverse l'avant-plan gauche (parallaxe), puis glisse avec la poussée, puis file à gauche au cran
      tl.fromTo("#f02-mug", { opacity: 1, x: 2020, scale: 1 }, { opacity: 1, x: 0, scale: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, 0.035);
      tl.fromTo("#f02-mugsvg", { filter: "blur(30px)" }, { filter: "blur(12px)", duration: 0.22, ease: "power2.out", immediateRender: false }, 0.035);
      tl.fromTo("#f02-mug", { x: 0, scale: 1 }, { x: -36, scale: 1.05, duration: 2.555, ease: "none", immediateRender: false }, 0.255);
      tl.fromTo("#f02-mug", { x: -36, scale: 1.05 }, { x: -640, scale: 1.7, duration: 0.11, ease: "power2.in", immediateRender: false }, 2.81);
      // 0.25 : « 2026 » s'allume
      tl.fromTo("#f02-y26", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, 0.22);
      // 0.63 : l'écran s'éveille, « Assistant IA » et son point jaune
      tl.fromTo("#f02-scroff", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, 0.63);
      tl.fromTo("#f02-head", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, 0.63);
      tl.fromTo("#f02-dot", { scale: 0 }, { scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, 0.63);
      // 1.03 : l'accueil monte (y 10 → 0, 0,12 s)
      tl.fromTo("#f02-hello", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, 1.03);
      // 1.41 : le champ « Écris ta demande… » ; 1.53 le caret clignote
      tl.fromTo("#f02-wfield", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, 1.41);

      /* ---------- sous-titre ---------- */
      function word(sel, cue) {
        tl.fromTo(sel, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, cue - 0.05);
        tl.fromTo(sel, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, cue + 0.09);
      }
      function keyword(n, cue, boxAt) {
        tl.fromTo("#f02-box" + n, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, boxAt);
        tl.fromTo("#f02-w" + (n + 3), { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, cue - 0.03);
        tl.fromTo("#f02-w" + (n + 3) + "d", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, boxAt + 0.06);
        tl.fromTo("#f02-w" + (n + 3) + "l", { opacity: 0.35 }, { opacity: 0, duration: 0.1, ease: "power1.out", immediateRender: false }, boxAt + 0.06);
      }
      // « Deux mille vingt-six. »
      word("#f02-w1", 0.25);
      word("#f02-w2", 0.49);
      word("#f02-w3", 0.73);
      tl.fromTo("#f02-sub1", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.40);
      // « [L’intelligence artificielle] ? » : le surligneur se trace à 1.63, puis continue sous « artificielle »
      keyword(1, 1.65, 1.63);
      keyword(2, 2.21, 2.17);
      word("#f02-w6", 2.40);
      tl.fromTo("#f02-sub2", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 2.93);

      /* ---------- scène 2 : le gag (muet) ---------- */
      // le caret (le même dans le champ du monde et dans le gros plan) : clignote, reste plein pendant la frappe,
      // clignote à 3.68, se fige à 4.03, clignote une fois à 4.53
      [[1.53, 1], [1.80, 0], [2.07, 1], [2.34, 0], [2.61, 1], [3.68, 0], [3.86, 1], [4.53, 0], [4.68, 1]].forEach(function (k) {
        tl.set("#f02-wcaret", { opacity: k[1] }, k[0]);
        tl.set("#f02-cucaret", { opacity: k[1] }, k[0]);
      });
      // 3.08 à 3.57 : « Pas pour » se tape, une lettre toutes les 0,07 s (le texte d'attente s'efface à la première lettre)
      var SEQ = [[3.08, "P"], [3.15, "Pa"], [3.22, "Pas"], [3.29, "Pas "], [3.36, "Pas p"], [3.43, "Pas po"], [3.50, "Pas pou"], [3.57, "Pas pour"]];
      var elCuTyped = document.getElementById("f02-cutyped"), elWTyped = document.getElementById("f02-wtyped");
      var elCuPh = document.getElementById("f02-cuph"), elWPh = document.getElementById("f02-wph");
      var shown = null;
      function typedAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (t >= SEQ[i][0] - 0.001) return SEQ[i][1]; }
        return "";
      }
      function renderTyping(t) {
        var s = typedAt(t);
        if (s === shown) return;
        shown = s;
        elCuTyped.textContent = s;
        elWTyped.textContent = s;
        elCuPh.style.display = s.length ? "none" : "";
        elWPh.style.display = s.length ? "none" : "";
      }
      var drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { renderTyping(drv.t); } }, 0);
      renderTyping(0);
      // 3.93 : la suggestion « moi. » en gris (0 → 0,32 en 0,08 s) et la touche TAB
      tl.fromTo("#f02-cumoi", { opacity: 0 }, { opacity: 0.32, duration: 0.08, ease: "power1.out", immediateRender: false }, 3.93);
      tl.fromTo("#f02-cutab", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.08, ease: "power2.out", immediateRender: false }, 3.93);
      tl.fromTo("#f02-wmoi", { opacity: 0 }, { opacity: 0.32, duration: 0.08, ease: "power1.out", immediateRender: false }, 3.93);
      // 4.03 : il se fige ; la suggestion respire à peine (0,32 ↔ 0,26)
      [[4.23, 0.32, 0.26], [4.38, 0.26, 0.32], [4.53, 0.32, 0.26], [4.68, 0.26, 0.32]].forEach(function (b) {
        tl.fromTo("#f02-cumoi", { opacity: b[1] }, { opacity: b[2], duration: 0.15, ease: "sine.inOut", immediateRender: false }, b[0]);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
