  <script>
    (function () {
      var FID = "03-monde";
      var T = 3.45;
      var $ = function (id) { return document.getElementById(id); };
      var toArr = function (list) { return Array.prototype.slice.call(list); };
      var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

      var lens = $("f03-lens"), driftEl = $("f03-drift"), camEl = $("f03-cam"), worldEl = $("f03-world");
      var dots = $("f03-dots"), line = $("f03-line"), flow = $("f03-flow");
      var labs = toArr(document.querySelectorAll(".f03-lab"));
      var streaks = toArr(document.querySelectorAll(".f03-streak"));

      /* ---------------- caméra (piste à part) ----------------
         cam2(cx, cy, s) : le point monde (cx, cy) au centre du cadre, échelle s ; la dérive d est en px écran.
         pA : recul 0 → 0.40 (expo.out), depuis le champ de saisie à ×1,2 jusqu'à cam2(2220, 450, 0,5)
         pT : travelling 1.20 → 1.60 (expo.inOut) jusqu'à cam2(4740, 450, 0,5)
         pP : poussée 3.10 → 3.45 (power2.in) ×0,5 → ×1,6 dans notre écran
         bI / bT / bP : flou caméra (px écran) ; k : taille d'écran de la frise ; flow : défilement de la ligne */
      var C = { pA: 0, pT: 0, pP: 0, d: 0, bI: 14, bT: 0, bP: 0, flow: 0, clock: 0 };

      var S0 = 1.2, S1 = 0.5, S2 = 1.6;
      var FIELD = { x: 3480, y: 592 };            /* centre du champ de saisie (monde) */
      var FIELD_WIDE = { x: 1590, y: 611 };       /* sa place dans le plan large cam2(2220, 450, 0,5) */
      var PUSH = { x: 3520, y: 390 };             /* cible de la poussée : l'écran de 2026, le post-it sort en haut à gauche */
      var PUSH0 = { x: 960 + (PUSH.x - 4740) * S1, y: 540 + (PUSH.y - 450) * S1 };

      function camera() {
        var s, cx, cy, sx, sy, p;
        if (C.pP > 0) {
          p = C.pP;
          s = S1 * Math.pow(S2 / S1, p);
          sx = PUSH0.x + ((960 - C.d) - PUSH0.x) * p;
          sy = PUSH0.y + (540 - PUSH0.y) * p;
          cx = PUSH.x - (sx - 960) / s;
          cy = PUSH.y - (sy - 540) / s;
        } else if (C.pT > 0) {
          s = S1; cx = 2220 + 2520 * C.pT; cy = 450;
        } else {
          p = C.pA;
          s = S0 * Math.pow(S1 / S0, p);
          sx = 960 + (FIELD_WIDE.x - 960) * p;
          sy = 540 + (FIELD_WIDE.y - 540) * p;
          cx = FIELD.x - (sx - 960) / s;
          cy = FIELD.y - (sy - 540) / s;
        }
        return { s: s, cx: cx, cy: cy };
      }

      /* ---------------- les portables des autres (calque d'écran) ----------------
         même trajectoire pour les trois, décalée de leur naissance : jaillissement de derrière notre portable
         (x 430, détente exponentielle 0,07 s), puis ils s'éloignent vers la droite (771 px/s) en rapetissant ;
         à 2.40 ils accélèrent et sortent par la droite (le dernier vers 2.62). Positions de P06 à 2.40. */
      var OB = [1.30, 1.70, 2.10];
      var X0 = 881.5, V0 = 771, A2 = -31.25, DB = 451.5, TB = 0.07, TE = 2.40, AE = 15000;
      var others = [1, 2, 3].map(function (i) {
        var o = { w: $("f03-o" + i), l: $("f03-o" + i + "l"), lt: $("f03-o" + i + "lt"), g: [], gt: [] };
        for (var g = 1; g <= 3; g++) { o.g.push($("f03-o" + i + "g" + g)); o.gt.push($("f03-o" + i + "g" + g + "t")); }
        return o;
      });
      function renderOthers(t) {
        for (var i = 0; i < 3; i++) {
          var o = others[i], tau = t - OB[i];
          if (tau < 0) { o.w.style.opacity = "0"; continue; }
          var e = Math.exp(-tau / TB);
          var x = X0 + V0 * tau + A2 * tau * tau - DB * e;
          var v = V0 + 2 * A2 * tau + (DB / TB) * e;
          if (t > TE) { x += AE * (t - TE) * (t - TE); v += 2 * AE * (t - TE); }
          var sc = clamp(0.3 - (x - 1110) * 0.000135, 0.14, 0.42);
          var off = 60 * clamp(v / V0, 0.6, 3.2);
          var xl = x - 600 * sc;
          if (xl - 3 * off > 1960) { o.w.style.opacity = "0"; continue; }
          var b = clamp(2 + 0.0086 * (x - 1110), 1.5, 12) + clamp((v - 1100) / 1500, 0, 4);
          o.w.style.opacity = String(clamp(tau / 0.06, 0, 1));
          o.w.style.transform = "translate(" + xl.toFixed(1) + "px," + (664 - 740 * sc).toFixed(1) + "px)";
          var scs = "scale(" + sc.toFixed(4) + ")";
          o.lt.style.transform = scs;
          o.l.style.filter = "blur(" + b.toFixed(2) + "px)";
          for (var g = 0; g < 3; g++) {
            o.gt[g].style.transform = scs;
            o.g[g].style.transform = "translateX(" + (-(g + 1) * off).toFixed(1) + "px)";
            o.g[g].style.filter = "blur(" + (b + 4).toFixed(2) + "px)";
          }
        }
      }

      /* ---------------- traînées rapides (avant-plan) : 2300 px/s, posées comme P06 à 2.40 ---------------- */
      function renderStreaks(t) {
        var env = t < 1.45 ? 0 : t < 1.6 ? (t - 1.45) / 0.15 : t < 2.6 ? 1 : t < 2.8 ? 1 - (t - 2.6) / 0.2 : 0;
        for (var j = 0; j < streaks.length; j++) {
          var el = streaks[j];
          var x = 820 + 90 * j + 2300 * (t - 2.4) - 650;
          var w = 160 + ((j * 53) % 220);
          if (env <= 0 || x < -w || x > 1280) { el.style.opacity = "0"; continue; }
          el.style.opacity = env.toFixed(3);
          el.style.transform = "translateX(" + x.toFixed(1) + "px)";
        }
      }

      /* ---------------- l'unique écrivain : appelé par la timeline à chaque image ---------------- */
      function render() {
        var c = camera(), s = c.s;
        driftEl.style.transform = "translate(" + C.d.toFixed(2) + "px,0px)";
        camEl.style.transform = "scale(" + s.toFixed(5) + ")";
        worldEl.style.transform = "translate(" + (960 - c.cx).toFixed(2) + "px," + (540 - c.cy).toFixed(2) + "px)";

        var b = C.bI + C.bT + C.bP;
        lens.style.filter = b > 0.25 ? "blur(" + b.toFixed(2) + "px)" : "none";

        /* fond en parallaxe 1/3 (le sol est plus loin que la frise) : translation et échelle atténuées */
        var sf = Math.pow(s / S1, 0.35);
        var fx = (-(c.cx - 2220) * S1 + C.d) / 3, fy = -(c.cy - 450) * S1 / 3;
        var per = 36 * sf;
        var mx = ((fx % per) + per) % per, my = ((fy % per) + per) % per;
        dots.style.transform = "translate(" + mx.toFixed(2) + "px," + my.toFixed(2) + "px) scale(" + sf.toFixed(4) + ")";

        /* frise : ligne, graduations et années gardent la taille d'écran du plan large (k = 1 → 2 pendant le recul) */
        var k = 1 + C.pA;
        line.style.transform = "scaleY(" + k.toFixed(4) + ")";
        flow.style.transform = "translateX(" + (C.flow % 400).toFixed(2) + "px) scaleY(" + k.toFixed(4) + ")";
        var ks = "scale(" + k.toFixed(4) + ")";
        for (var i = 0; i < labs.length; i++) labs[i].style.transform = ks;

        renderOthers(C.clock);
        renderStreaks(C.clock);
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });

      /* ===== piste caméra ===== */
      tl.fromTo(C, { clock: 0 }, { clock: T, duration: T, ease: "none" }, 0);
      tl.fromTo(C, { pA: 0 }, { pA: 1, duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo(C, { bI: 14 }, { bI: 0, duration: 0.4, ease: "expo.out" }, 0);
      /* dérive : +20 px/s en scène 1, remise à zéro sous le travelling, +30 px/s en scène 2 */
      tl.fromTo(C, { d: 0 }, { d: -24, duration: 1.2, ease: "none" }, 0);
      tl.fromTo(C, { d: -24 }, { d: 0, duration: 0.4, ease: "expo.inOut", immediateRender: false }, 1.2);
      tl.fromTo(C, { d: 0 }, { d: -55.5, duration: 1.85, ease: "none", immediateRender: false }, 1.6);
      /* travelling vers la droite, flou au milieu du trajet */
      tl.fromTo(C, { pT: 0 }, { pT: 1, duration: 0.4, ease: "expo.inOut", immediateRender: false }, 1.2);
      tl.fromTo(C, { bT: 0 }, { bT: 8, duration: 0.2, ease: "expo.in", immediateRender: false }, 1.2);
      tl.fromTo(C, { bT: 8 }, { bT: 0, duration: 0.2, ease: "expo.out", immediateRender: false }, 1.4);
      /* poussée dans notre écran, flou 0 → 14 px sur la même courbe */
      tl.fromTo(C, { pP: 0 }, { pP: 1, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.1);
      tl.fromTo(C, { bP: 0 }, { bP: 14, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.1);
      /* le halo suit le sujet : plan large (P05) → notre portable à gauche (P06) → l'écran au centre */
      var halo = $("f03-halo");
      tl.fromTo(halo, { x: 0, scaleX: 1, scaleY: 1 }, { x: -260, scaleX: 0.895, scaleY: 1, duration: 0.4, ease: "expo.inOut", immediateRender: false }, 1.2);
      tl.fromTo(halo, { x: -260, scaleX: 0.895, scaleY: 1 }, { x: 0, scaleX: 1.05, scaleY: 1.1, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.1);

      /* ===== Scene 1 (0.00 à 1.20) : P05, « Le problème ? » ===== */
      var pi1 = $("f03-pi1"), pi2 = $("f03-pi2"), pi3 = $("f03-pi3");
      gsap.set(pi1, { rotation: -7 });
      gsap.set(pi2, { rotation: 6 });
      /* 0.066 → 0.15 : le troisième post-it arrive de la caméra (×1,6, flou 10, -14° → -5°) et se colle ; claquement 0,97 → 1 */
      tl.fromTo(pi3,
        { opacity: 1, x: 80, y: 140, scale: 1.6, rotation: -14, filter: "blur(10px)" },
        { opacity: 1, x: 0, y: 0, scale: 0.97, rotation: -5, filter: "blur(0px)", duration: 0.084, ease: "power3.out", immediateRender: false },
        0.066);
      tl.fromTo(pi3, { scale: 0.97 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.15);
      /* 0.60 : les trois post-its frémissent l'un après l'autre (±2°, décalage 0,05 s) */
      [[pi1, -7], [pi2, 6], [pi3, -5]].forEach(function (pr, n) {
        var el = pr[0], r = pr[1], t0 = 0.6 + n * 0.05;
        tl.fromTo(el, { rotation: r }, { rotation: r + 2, duration: 0.06, ease: "sine.out", immediateRender: false }, t0);
        tl.fromTo(el, { rotation: r + 2 }, { rotation: r - 2, duration: 0.1, ease: "sine.inOut", immediateRender: false }, t0 + 0.06);
        tl.fromTo(el, { rotation: r - 2 }, { rotation: r, duration: 0.12, ease: "sine.out", immediateRender: false }, t0 + 0.16);
      });
      /* 0.90 : la ligne commence à glisser vers la droite (le temps file), puis défile en scène 2 et ralentit */
      tl.fromTo(flow, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 0.9);
      tl.fromTo(C, { flow: 0 }, { flow: 400, duration: 0.4, ease: "power2.in", immediateRender: false }, 0.9);
      tl.fromTo(C, { flow: 400 }, { flow: 3100, duration: 1.35, ease: "none", immediateRender: false }, 1.3);
      tl.fromTo(C, { flow: 3100 }, { flow: 3900, duration: 0.8, ease: "power2.out", immediateRender: false }, 2.65);

      /* ===== Scene 2 (1.20 à 3.45) : P06, « Le monde, lui, n’a pas attendu. » ===== */
      /* « 2027 », « 2028 », « 2029 » défilent sous la ligne (300 unités monde/s), filés */
      tl.fromTo(toArr(document.querySelectorAll(".f03-fut")), { x: 0 }, { x: 675, duration: 2.25, ease: "none", immediateRender: false }, 1.2);
      /* 2.60 : notre portable reste seul, son écran baisse un peu */
