<script src="assets/js/gsap.min.js"></script>
<script>
  (function () {
    var FID = "04-soiree";
    var D = 3.65;
    var byId = function (id) { return document.getElementById(id); };
    var toArr = function (list) { return Array.prototype.slice.call(list); };

    /* ---------- réglages ---------- */
    var S0 = 1638 / 1180;            /* handoff_in : la dalle remplit ~80 % du cadre (×1,6 de la dalle de 1024 px) */
    var WIN_CX = 1165, WIN_CY = 470; /* centre de la fenêtre (monde) = la dalle dans laquelle pousse la séquence 3 */
    var T_LAND = 0.15;               /* atterrissage expo.out */
    var T_W1 = 1.95, T_W1D = 0.15;   /* whip 1 (fenêtre seulement) */
    var T_W2 = 3.45;                 /* whip 2, jusqu'à la fin */
    var DRIFT_V = -12;               /* px/s, toute la séquence */
    var PUSH_V = 0.015;              /* échelle/s, scène 1 */
    var SD = 1 + PUSH_V * (T_W1 - T_LAND);           /* 1,027 */
    var XD1 = DRIFT_V * (T_W1 - T_LAND);             /* -21,6 px à 1.95 */
    var XD_210 = XD1 + DRIFT_V * T_W1D;              /* -23,4 px à 2.10 */
    var XD_END = XD1 + DRIFT_V * (D - T_W1);         /* -42 px à 3.65 */
    /* le volet des applis : à 2.10 la « Messagerie » tombe exactement à la place de P08 (575, 110), dérive comprise */
    var PANE_X = (-1920 - XD_210) / SD;
    var PANE_S = 1 / SD;
    var PANE_X2 = PANE_X - 1100 / SD;                /* whip 2 : 1100 px à l'écran à 3.65 */

    var DARK = "#f3f1ec", DARK_GRAY = "rgba(243, 241, 236, 0.35)";
    var INK = "#17181c", INK_GRAY = "rgba(23, 24, 28, 0.35)";

    var digit = byId("f04-digit");
    var unread = byId("f04-unread");
    var HH = byId("f04-hh"), MH = byId("f04-mh"), SH = byId("f04-sh");

    /* heure numérique et compteur : écrits par render() seul, à partir de deux proxys tweenés */
    var clk = { m: 1080 };   /* minutes depuis minuit (18:00) */
    var cnt = { n: 87 };
    var lastD = "", lastN = "";
    function hhmm(v) {
      v = ((Math.round(v) % 1440) + 1440) % 1440;
      var h = Math.floor(v / 60), m = v % 60;
      return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    }
    function render() {
      var d = hhmm(clk.m);
      if (d !== lastD) { digit.textContent = d; lastD = d; }
      var n = String(Math.round(cnt.n));
      if (n !== lastN) { unread.textContent = n; lastN = n; }
    }

    var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

    /* ================= PISTE CAMÉRA (à part des objets) ================= */
    /* 0.00 à 0.15 : la poussée se pose (coordinate-target-zoom inversé : #f04-cam met l'échelle autour du centre,
       #f04-world contre-translate de -offset ; même durée, même courbe) */
    tl.fromTo("#f04-cam", { scale: S0 }, { scale: 1, duration: T_LAND, ease: "expo.out" }, 0);
    tl.fromTo("#f04-world", { x: 960 - WIN_CX, y: 540 - WIN_CY }, { x: 0, y: 0, duration: T_LAND, ease: "expo.out" }, 0);
    /* le flou retombe moins vite que l'échelle : le contenu de la dalle reste illisible pendant le fondu */
    tl.fromTo("#f04-g1", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: T_LAND, ease: "power2.out" }, 0);
    /* dérive x -12 px/s, poussée 1,5 %/s (scène 1), puis dérive seule (scène 2) */
    tl.fromTo("#f04-drift", { x: 0, scale: 1 }, { x: XD1, scale: SD, duration: T_W1 - T_LAND, ease: "none", immediateRender: false }, T_LAND);
    tl.fromTo("#f04-drift", { x: XD1 }, { x: XD_END, duration: D - T_W1, ease: "none", immediateRender: false }, T_W1);
    /* 1.95 à 2.10 : whip vers la droite sur la fenêtre seulement (expo.inOut, flou 10 px) ; l'horloge reste */
    tl.set("#f04-g2", { opacity: 1 }, T_W1);
    tl.fromTo("#f04-pane", { x: 0, scale: 1 }, { x: PANE_X, scale: PANE_S, duration: T_W1D, ease: "expo.inOut", immediateRender: false }, T_W1);
    tl.fromTo("#f04-g1", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.08, ease: "power2.in", immediateRender: false }, T_W1);
    /* 3.45 à 3.65 : whip vers la droite (power2.in, flou 0 → 14 px) : la « Messagerie » sort par la gauche */
    tl.fromTo("#f04-pane", { x: PANE_X }, { x: PANE_X2, duration: D - T_W2, ease: "power2.in", immediateRender: false }, T_W2);
    tl.fromTo("#f04-g2", { filter: "blur(0px)" }, { filter: "blur(14px)", duration: D - T_W2, ease: "power2.in", immediateRender: false }, T_W2);

    /* ================= OBJETS ================= */
    /* handoff_in : le post-it finit de sortir par le haut à gauche, flou (sortie par le mouvement, image 3) */
    tl.fromTo("#f04-postit",
      { x: -90, y: -150, rotation: -12, scale: 1.6, filter: "blur(14px)" },
      { x: -570, y: -590, rotation: -20, scale: 1.6, filter: "blur(14px)", duration: 0.12, ease: "none" }, 0);
    /* la dalle du portable devient la fenêtre « Présentation » (fondu après les 2 images de la couture) */
    tl.fromTo("#f04-skinui", { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: false }, 0.04);
    tl.fromTo(["#f04-skin", "#f04-lid"], { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none", immediateRender: false }, 0.04);

    /* l'horloge murale arrive de la caméra à gauche (×1,4, flou 10 → net en 0,14 s), à 18:00 */
    tl.fromTo("#f04-clockgrp",
      { opacity: 0, scale: 1.4, x: -40, filter: "blur(10px)" },
      { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false }, 0.067);

    /* aiguilles : rotation SVG autour du centre du cadran */
    gsap.set([HH, MH, SH], { svgOrigin: "150 150" });
    gsap.set(HH, { rotation: 540 });
    gsap.set(MH, { rotation: 0 });
    gsap.set(SH, { rotation: 0 });
    function rot(el, a, b, t, d, ease) {
      tl.fromTo(el, { rotation: a }, { rotation: b, duration: d, ease: ease, immediateRender: false }, t);
    }
    function tick(a, t) { rot(SH, a, a + 6, t, 0.06, "power3.out"); }
    function roll(a, b, t, d, ease) {
      tl.fromTo(clk, { m: a }, { m: b, duration: d, ease: ease, immediateRender: false }, t);
    }

    /* scène 1 : 18:00, la trotteuse avance */
    tick(0, 0.30); tick(6, 0.55); tick(12, 0.80);
    /* « te prend » : deux tours jusqu'à 22:47 (power2.inOut), posé à 1.65 pour l'image clé */
    var R1 = 0.90, R1D = 0.75;
    rot(HH, 540, 683.5, R1, R1D, "power2.inOut");
    rot(MH, 0, 1002, R1, R1D, "power2.inOut");
    rot(SH, 18, 894, R1, R1D, "power2.inOut");
    roll(1080, 1367, R1, R1D, "power2.inOut");
    tl.fromTo("#f04-halo-night", { opacity: 0 }, { opacity: 1, duration: R1D, ease: "sine.inOut", immediateRender: false }, R1);
    tick(894, 1.85);
    /* sous le whip : la nuit passe, 22:47 → 08:30 */
    var RN = 1.95, RND = 0.25;
    rot(HH, 683.5, 975, RN, RND, "power2.inOut");
    rot(MH, 1002, 1620, RN, RND, "power2.inOut");
    rot(SH, 900, 1440, RN, RND, "power2.inOut");
    roll(1367, 1950, RN, RND, "power2.inOut");
    tick(1440, 2.35); tick(1446, 2.50);
    /* scène 2 : l'horloge file de 08:30 à 12:00, le halo devient chaud ; posée à 3.15 pour l'image clé */
    var R3 = 2.62, R3D = 0.53;
    rot(HH, 975, 1080, R3, R3D, "power2.inOut");
    rot(MH, 1620, 2160, R3, R3D, "power2.inOut");
    rot(SH, 1452, 2160, R3, R3D, "power2.inOut");
    roll(1950, 2160, R3, R3D, "power2.inOut");
    tl.fromTo("#f04-halo-night", { opacity: 1 }, { opacity: 0, duration: R3D, ease: "sine.inOut", immediateRender: false }, R3);
    tl.fromTo("#f04-halo-warm", { opacity: 0 }, { opacity: 1, duration: R3D, ease: "sine.inOut", immediateRender: false }, R3);

    /* scène 1 : 0.23 « Ta présentation » : diapo 1 sélectionnée, le titre vide, « DIAPO 1 / 20 » */
    var thumbs = toArr(byId("f04-win1").getElementsByClassName("f04-thumb"));
    tl.fromTo(thumbs, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", stagger: 0.035, immediateRender: false }, 0.23);
    tl.fromTo("#f04-slide", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, 0.23);
    tl.fromTo("#f04-ph", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, 0.30);
    tl.fromTo("#f04-count1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, 0.36);

    /* 0.65 : le curseur arrive d'un seul mouvement courbe (x et y sur deux courbes) et clique directement dans le titre */
    tl.set("#f04-cur", { opacity: 1 }, 0.20);
    tl.fromTo("#f04-cur", { x: 1016 }, { x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.20);
    tl.fromTo("#f04-cur", { y: 330 }, { y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 0.20);
    tl.fromTo("#f04-cur", { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.out", immediateRender: false }, 0.65);
    tl.fromTo("#f04-cur", { scale: 0.85 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.71);
    tl.fromTo("#f04-ripple", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.35, ease: "power2.out", immediateRender: false }, 0.65);
    /* le pointeur s'efface quand on écrit ; le caret clignote, rien ne s'écrit (éteint à l'image clé 1.65) */
    tl.fromTo("#f04-cur", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, 0.90);
    [[0.68, 1], [0.93, 0], [1.18, 1], [1.43, 0], [1.68, 1], [1.93, 0]].forEach(function (s) {
      tl.set("#f04-caret", { opacity: s[1] }, s[0]);
    });

    /* scène 2 : 2.10 la boîte de réception se pose (fin du whip, expo.out) */
    gsap.set("#f04-g2", { scale: 1.04 });
    tl.fromTo("#f04-g2", { filter: "blur(10px)", scale: 1.04 }, { filter: "blur(0px)", scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, T_W1 + 0.07);
    /* 2.21 « Tes mails » : sept lignes montent du bas (décalage 0,04 s) */
    var rows = toArr(byId("f04-win2").getElementsByClassName("f04-row"));
    tl.fromTo(rows, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", stagger: 0.04, immediateRender: false }, 2.21);
    /* 2.45 : le compteur roule de 87 à 94 (counting-dynamic-scale : valeur et échelle, même courbe, même durée) */
    gsap.set(unread, { scale: 0.8 });
    tl.fromTo(cnt, { n: 87 }, { n: 94, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.45);
    tl.fromTo(unread, { scale: 0.8 }, { scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.45);

    /* ================= SOUS-TITRES ================= */
    function word(el, t, gray, full) {
      tl.fromTo(el,
        { opacity: 0, y: 8, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
      /* passe à l'encre pleine pendant l'arrivée : plein à t + 0,12 (images clés 1.65 et 3.15) */
      tl.fromTo(el, { color: gray }, { color: full, duration: 0.12, ease: "power1.inOut", immediateRender: false }, t);
    }
    function box(el, t) {
      tl.fromTo(el,
        { clipPath: "inset(-12% 106% -12% -6%)" },
        { clipPath: "inset(-12% -6% -12% -6%)", duration: 0.16, ease: "power3.out", immediateRender: false }, t);
    }
    function subOut(sub, t) {
      tl.fromTo(toArr(sub.children),
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, t);
    }
    var F = 1 / 30;
    /* « Ta présentation te prend [une soirée]. » : Ta@0.23 présentation@0.41 te@0.95 prend@1.17 une@1.32 soirée@1.53 */
    var w1 = toArr(byId("f04-sub1").getElementsByClassName("f04-w"));
    word(w1[0], 0.23 - F, DARK_GRAY, DARK);
    word(w1[1], 0.41 - F, DARK_GRAY, DARK);
    word(w1[2], 0.95 - F, DARK_GRAY, DARK);
    word(w1[3], 1.17 - F, DARK_GRAY, DARK);
    box(byId("f04-hl1"), 1.30);
    word(w1[4], 1.30, INK_GRAY, INK);
    word(w1[5], 1.53 - F, INK_GRAY, INK);
    word(w1[6], 1.53 - F, DARK_GRAY, DARK);
    subOut(byId("f04-sub1"), 1.92);
    /* « Tes mails, [ta matinée]. » : Tes@2.21 mails@2.45 ta@2.92 matinée@3.06 */
    var w2 = toArr(byId("f04-sub2").getElementsByClassName("f04-w"));
    word(w2[0], 2.21 - F, DARK_GRAY, DARK);
    word(w2[1], 2.45 - F, DARK_GRAY, DARK);
    box(byId("f04-hl2"), 2.90);
    word(w2[2], 2.90, INK_GRAY, INK);
    word(w2[3], 3.06 - F, INK_GRAY, INK);
    word(w2[4], 3.06 - F, DARK_GRAY, DARK);
    subOut(byId("f04-sub2"), 3.35);

    render();

    window.__timelines = window.__timelines || {};
    window.__timelines[FID] = tl;
  })();
</script>
