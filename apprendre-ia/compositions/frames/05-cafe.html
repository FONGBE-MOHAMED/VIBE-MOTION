  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "05-cafe";
      var D = 4.4;
      var S1 = 1.1; /* la caméra part de ×1,1 sur le monde de P09 (contre-zoomé) ; le recul la ramène à ×1 */
      var $ = function (id) { return document.getElementById(id); };
      var INK = "#f3f1ec", INK_GRAY = "rgba(243, 241, 236, 0.35)";
      var INK_DARK = "#17181c", INK_DARK_GRAY = "rgba(23, 24, 28, 0.35)";

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ---------- outils ---------- */
      function on(el, t) { tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, t); }
      function off(el, t) { tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, t); }
      /* arrivée en cascade (waterfall-entry) : opacité binaire, fouet depuis le bas */
      function pop(el, t, dy, d) {
        on(el, t);
        tl.fromTo(el, { y: dy }, { y: 0, duration: d, ease: "power4.out", immediateRender: false }, t);
      }
      /* se pose (loi 4) : un peu trop grand et flou, puis net */
      function land(el, t) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, t);
        tl.fromTo(el, { scale: 1.08, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false }, t);
      }
      /* un mot du sous-titre : gris, y +8, flou 6 → net en 0,14 s, puis encre pleine */
      function word(el, t, inBox) {
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(el, { color: inBox ? INK_DARK_GRAY : INK_GRAY }, { color: inBox ? INK_DARK : INK, duration: inBox ? 0.1 : 0.2, ease: "power1.inOut", immediateRender: false }, t + (inBox ? 0.03 : 0.1));
      }
      /* le surligneur se trace depuis la gauche (0,16 s power3.out) */
      function box(el, t) {
        on(el, t);
        tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.16, ease: "power3.out", immediateRender: false }, t);
      }
      /* sortie du sous-titre : opacité 1 → 0 et flou 0 → 6 px en 0,14 s (sur chaque mot, pas sur la bande entière) */
      function exitSub(els, t) {
        tl.fromTo(els, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, t);
      }

      /* ================= PISTE CAMÉRA (à part des objets) ================= */
      var DRIFT = [$("f05-drift"), $("f05-gdrift")];
      var CAM = [$("f05-cam"), $("f05-gcam")];
      var WORLD = [$("f05-world"), $("f05-gworld")];
      gsap.set(DRIFT.concat(CAM), { transformOrigin: "960px 540px" });
      gsap.set(CAM, { scale: S1 });
      gsap.set($("f05-s1"), { scale: 1 / S1, transformOrigin: "960px 540px" });
      /* Scene 1 : dérive x -12 px/s */
      tl.fromTo(DRIFT, { x: 0 }, { x: -21, duration: 1.75, ease: "none" }, 0);
      /* 1.75 à 2.10 : recul expo.out vers le partage */
      tl.fromTo(CAM, { scale: S1 }, { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, 1.75);
      /* 2.10 : cran léger vers la colonne de droite (0,12 s) */
      tl.fromTo(WORLD, { x: 0 }, { x: -30, duration: 0.12, ease: "expo.inOut", immediateRender: false }, 2.1);
      /* Scene 2 : poussée lente ×1 → ×1,03 jusqu'à la coupe */
      tl.fromTo(DRIFT, { scale: 1 }, { scale: 1.03, duration: D - 2.1, ease: "none", immediateRender: false }, 2.1);

      /* ================= Scene 1 (0.00 à 1.90) : Ta compta, ton dimanche ================= */
      /* 0.00 à 0.16 : le whip se termine, le tableur se pose ; l'horloge reste nette à sa place */
      tl.fromTo($("f05-strip"), { x: 0 }, { x: -1400, duration: 0.16, ease: "power3.out" }, 0);
      tl.fromTo([$("f05-msg"), $("f05-win")], { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 0);

      /* 0.22 « Ta compta » : les lignes se remplissent une à une (0,05 s) : date, libellé, montant */
      for (var r = 0; r < 8; r++) {
        var cs = $("f05-r" + (r + 1)).getElementsByClassName("f05-c");
        for (var c = 0; c < cs.length; c++) pop(cs[c], 0.2 + r * 0.05 + c * 0.017, 16, 0.13);
        if (r < 7) pop($("f05-r" + (r + 1)).children[2].firstElementChild, 0.2 + r * 0.05 + 2 * 0.017, 16, 0.13);
      }
      /* 0.70 : le curseur tape dans une cellule (le montant de la dernière ligne) */
      var CW = 0.612 * 22; /* chasse de Space Mono à 22 px */
      var caret = $("f05-caret"), sel = $("f05-sel");
      var chs = $("f05-amt8").getElementsByClassName("f05-ch");
      on(sel, 0.66);
      on(caret, 0.66);
      for (var k = 0; k < chs.length; k++) {
        var tk = 0.7 + k * 0.035;
        on(chs[k], tk);
        tl.fromTo(caret, { x: k * CW }, { x: (k + 1) * CW, duration: 0.01, ease: "none", immediateRender: false }, tk);
      }
      off(caret, 0.96);
      tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out", immediateRender: false }, 1.03);

      /* 1.03 « ton dimanche » : « DIM. » s'imprime, les aiguilles filent de 10:00 à 18:30, le halo devient gris */
      var dim = $("f05-dim");
      gsap.set(dim, { svgOrigin: "150 206" });
      on(dim, 1.02);
      tl.fromTo(dim, { scale: 1.45 }, { scale: 1, duration: 0.14, ease: "expo.out", immediateRender: false }, 1.02);
      var bh = $("f05-bh"), bm = $("f05-bm"), bs = $("f05-bs");
      gsap.set([bh, bm, bs], { svgOrigin: "150 150", rotation: 0 });
      tl.fromTo(bh, { rotation: 0 }, { rotation: -60, duration: 0.01, ease: "none", immediateRender: false }, 1.02);
      tl.fromTo(bh, { rotation: -60 }, { rotation: 195, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 1.035);
      tl.fromTo(bm, { rotation: 0 }, { rotation: 900, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 1.035);
      tl.fromTo(bs, { rotation: 0 }, { rotation: 1260, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 1.035);
      tl.fromTo($("f05-halo-g"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut", immediateRender: false }, 1.03);
      tl.fromTo($("f05-halo-w"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "sine.inOut", immediateRender: false }, 1.03);
      /* mise au point : l'horloge est le sujet, le tableur recule (flou léger + baisse), puis revient */
      var wwrap = $("f05-wwrap"), win = $("f05-win");
      tl.fromTo(wwrap, { "--dof": "0px" }, { "--dof": "1.2px", duration: 0.24, ease: "power2.inOut", immediateRender: false }, 1.03);
      tl.fromTo(win, { opacity: 1 }, { opacity: 0.9, duration: 0.24, ease: "power2.inOut", immediateRender: false }, 1.03);
      tl.fromTo(wwrap, { "--dof": "1.2px" }, { "--dof": "0px", duration: 0.14, ease: "power2.out", immediateRender: false }, 1.5);
      tl.fromTo(win, { opacity: 0.9 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, 1.5);

      /* 1.60 : pas de total (la ligne « Total » reste vide, le caret attend) */
      pop($("f05-total"), 1.6, 14, 0.14);
      on($("f05-caret2"), 1.64);
      off($("f05-caret2"), 1.8);

      /* ================= 1.80 à 2.20 : l'horloge et la fenêtre deviennent la carte « Compta » ================= */
      var bclock = $("f05-bclock");
      gsap.set(bclock, { transformOrigin: "315px 430px" });
      tl.fromTo($("f05-bdig"), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.in", immediateRender: false }, 1.8);
      tl.fromTo(dim, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in", immediateRender: false }, 1.86);
      /* centre de l'horloge de la carte « Compta » (P10 (800, 675) + 51) ramené dans le repère contre-zoomé */
      tl.fromTo(bclock, { x: 0, y: 0, scale: 1 }, { x: 525.1, y: 258.5, scale: 0.44, duration: 0.24, ease: "power3.inOut", immediateRender: false }, 1.82);
      /* la fenêtre rétrécit dans la carte (rectangle de P10 (180, 590, 700 × 170) + 51, même repère) */
      gsap.set(wwrap, { transformOrigin: "0px 0px" });
      tl.fromTo([$("f05-wbody"), $("f05-wtitle")], { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in", immediateRender: false }, 1.9);
      tl.fromTo($("f05-wdark"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.in", immediateRender: false }, 1.96);
      tl.fromTo(wwrap, { x: 0, y: 0, scaleX: 1, scaleY: 1 }, { x: -416.9, y: 485, scaleX: 0.6525, scaleY: 0.2597, duration: 0.22, ease: "power2.inOut", immediateRender: false }, 1.9);
      tl.fromTo($("f05-c3bg"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, 2.1);
      tl.fromTo(wwrap, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: false }, 2.12);
      pop($("f05-c3t"), 2.12, 10, 0.14);
      pop($("f05-c3d"), 2.14, 10, 0.14);
      tl.fromTo($("f05-c3clk"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, 2.13);
      tl.fromTo(bclock, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: false }, 2.15);

      /* ================= Scene 2 (1.90 à 4.40) : Avant le café ================= */
      /* « Présentation · 22:47 » et « Mails · 12:00 » se posent au-dessus (décalage 0,05 s) */
      pop($("f05-ltoi"), 1.98, 10, 0.14);
      land($("f05-cl1"), 2.03);
      land($("f05-cl2"), 2.08);
      /* 2.10 « Pour d'autres » : la colonne « D'autres » glisse depuis la droite */
      [["f05-lautres", 2.06], ["f05-cr1", 2.07], ["f05-cr2", 2.1], ["f05-cr3", 2.13]].forEach(function (p) {
        var el = $(p[0]);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, p[1]);
        tl.fromTo(el, { x: 760, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out", immediateRender: false }, p[1]);
      });
      /* 2.69, 2.85, 3.00 « c'est réglé » : trois coches jaunes */
      [[1, 2.66], [2, 2.82], [3, 2.97]].forEach(function (p) {
        var ck = $("f05-ck" + p[0]), tick = ck.firstElementChild, t = p[1];
        on(ck, t);
        tl.fromTo(ck, { scale: 1.7, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false }, t);
        tl.fromTo(tick, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, t + 0.04);
      });
      /* 3.06 « avant le café » : la tasse arrive devant (de la caméra, floue, puis posée) */
      var mug = $("f05-mug");
      gsap.set(mug, { scale: 0.85, transformOrigin: "50% 100%" });
      tl.fromTo(mug, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, 3.04);
      tl.fromTo(mug, { scale: 1.45, x: 90, filter: "blur(12px)" }, { scale: 0.85, x: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out", immediateRender: false }, 3.04);
      /* fumée vivante jusqu'à la coupe (boucle déroulée, répétitions finies) */
      ["f05-st1", "f05-st2", "f05-st3"].forEach(function (id, i) {
        var el = $(id), t = 3.16 + i * 0.13, up = true, P = 0.44;
        while (t < D - 0.02) {
          var d = Math.min(P, D - t);
          tl.fromTo(el, { y: up ? 0 : -10, opacity: up ? 1 : 0.4 }, { y: up ? -10 : 0, opacity: up ? 0.4 : 1, duration: d, ease: "sine.inOut", immediateRender: false }, t);
          t += P;
          up = !up;
        }
      });
      /* 3.80 : les petites horloges de gauche tournent encore (jusqu'à la coupe) */
      [[1, 323.5, 282, 174], [2, 0, 0, 0], [3, 195, 180, 180]].forEach(function (c) {
        var h = $("f05-h" + c[0] + "h"), m = $("f05-h" + c[0] + "m"), s = $("f05-h" + c[0] + "s");
        gsap.set([h, m, s], { svgOrigin: "60 60" });
        gsap.set(h, { rotation: c[1] });
        gsap.set(m, { rotation: c[2] });
        gsap.set(s, { rotation: c[3] });
        tl.fromTo(h, { rotation: c[1] }, { rotation: c[1] + 12.5, duration: D - 3.8, ease: "none", immediateRender: false }, 3.8);
        tl.fromTo(m, { rotation: c[2] }, { rotation: c[2] + 150, duration: D - 3.8, ease: "none", immediateRender: false }, 3.8);
        tl.fromTo(s, { rotation: c[3] }, { rotation: c[3] + 360, duration: D - 3.8, ease: "none", immediateRender: false }, 3.8);
      });

      /* ================= sous-titres ================= */
      /* chaque mot démarre 0,04 s avant son repère : il est lisible à l'image du repère (0 à 2 images d'avance) */
      word($("f05-a1"), 0.18);
      word($("f05-a2"), 0.31);
      box($("f05-box1"), 0.98);
      word($("f05-a3"), 0.99, true);
      word($("f05-a4"), 1.21, true);
      word($("f05-a5"), 1.23);
      exitSub([$("f05-a1"), $("f05-a2"), $("f05-hl1"), $("f05-a5")], 1.88);

      word($("f05-b1"), 2.06);
      word($("f05-b2"), 2.26);
      word($("f05-b3"), 2.42);
      word($("f05-b4"), 2.65);
      box($("f05-box2"), 3.01);
      word($("f05-b5"), 3.02, true);
      word($("f05-b6"), 3.38, true);
      word($("f05-b7"), 3.58, true);
      word($("f05-b8"), 3.6);
      /* 3.98 : le sous-titre sort */
      exitSub([$("f05-b1"), $("f05-b2"), $("f05-b3"), $("f05-b4"), $("f05-hl2"), $("f05-b8")], 3.98);

      /* ================= heures numériques (calculées depuis le temps de la timeline) ================= */
      var E_SPIN = gsap.parseEase("power2.inOut"), E_TURN = gsap.parseEase("none");
      var bdig = $("f05-bdig"), d1 = $("f05-d1"), d2 = $("f05-d2");
      function hhmm(v) {
        v = Math.floor(v + 1e-6);
        var h = Math.floor(v / 60) % 24, m = v % 60;
        return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
      }
      function put(el, s) { if (el.textContent !== s) el.textContent = s; }
      function render() {
        var t = tl.time();
        put(bdig, t < 1.02 ? "12:00" : hhmm(600 + 510 * E_SPIN(Math.min(1, Math.max(0, (t - 1.035) / 0.36)))));
        var q = t < 3.8 ? 0 : 25 * E_TURN(Math.min(1, (t - 3.8) / (D - 3.8)));
        put(d1, hhmm(22 * 60 + 47 + q));
        put(d2, hhmm(12 * 60 + q));
      }

      tl.to({}, { duration: D }, 0);
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
