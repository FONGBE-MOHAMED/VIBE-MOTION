      pkDraw.style.strokeDasharray = len + " " + len;
      pkDraw.style.strokeDashoffset = String(len);

      /* flou vertical du post-it (proxy) */
      var P = { vb: 0 };
      function render() {
        var k = Math.round(P.vb * 2);
        lead.style.filter = k > 0 ? "url(#f06-vb" + k + ")" : "none";
      }

      /* état de départ (handoff_in) écrit par GSAP : identique quel que soit l'ordre des seeks */
      var postits = [postit];
      for (var gi = 0; gi < ghosts.length; gi++) postits.push(ghosts[gi].firstElementChild);
      gsap.set([lead].concat(ghosts), { y: 0 });
      gsap.set(postits, { rotation: -5 });

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ===== piste caméra : poussée très lente ×1 → ×1,03 vers (960, 210) ===== */
      gsap.set(drift, { transformOrigin: "960px 210px" });
      tl.fromTo(drift, { scale: 1 }, { scale: 1.03, duration: T, ease: "none" }, 0);

      /* ===== « Pas » 0.09, « cette » 0.25, « fois. » 0.42 (un peu avant le repère) ===== */
      var GRAY = "rgba(243, 241, 236, 0.35)";
      var INK = "#f3f1ec";
      function word(el, cue) {
        var t = cue - 0.04;
        tl.fromTo(el,
          { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false },
          t);
        tl.fromTo(el, { color: GRAY }, { color: INK, duration: 0.2, ease: "power1.inOut", immediateRender: false }, t + 0.1);
      }
      word(words[0], 0.09);
      word(words[1], 0.25);
      word(words[2], 0.42);

      /* ===== 0.30 à 0.70 : le trait jaune se dessine sous « cette fois. » ===== */
      tl.fromTo(pkDraw, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.3);

      /* ===== 0.70 : le coin se décolle (-5° → 18°, 0,2 s power2.in) ===== */
      tl.fromTo(postit, { rotation: -5 }, { rotation: 18, duration: 0.2, ease: "power2.in", immediateRender: false }, 0.7);

      /* ===== 0.90 : il tombe (y +900 en 0,35 s power2.in, flou vertical 8 px) et sort par le bas ;
         même courbe prolongée jusqu'à 0,45 s (y +1488) pour qu'il quitte le cadre ===== */
      var FALL_D = 0.45;
      var FALL_Y = 900 * Math.pow(FALL_D / 0.35, 2);
      tl.fromTo(lead, { y: 0 }, { y: FALL_Y, duration: FALL_D, ease: "power2.in", immediateRender: false }, 0.9);
      tl.fromTo(P, { vb: 0 }, { vb: 8, duration: 0.35, ease: "power2.in", immediateRender: false }, 0.9);
      /* traînée : chaque copie rejoue la chute avec un retard de LAG × i */
      for (var i = 0; i < ghosts.length; i++) {
        var g = ghosts[i];
        var lag = LAG * (i + 1);
        tl.fromTo(g.firstElementChild, { rotation: -5 }, { rotation: 18, duration: 0.2, ease: "power2.in", immediateRender: false }, 0.7 + lag);
        tl.fromTo(g, { y: 0 }, { y: FALL_Y, duration: FALL_D, ease: "power2.in", immediateRender: false }, 0.9 + lag);
        tl.fromTo(g, { opacity: 0 }, { opacity: GHOST_OP[i], duration: 0.12, ease: "power1.out", immediateRender: false }, 0.9 + lag);
        /* la traînée se résorbe quand le post-it a quitté le cadre (vers 1.28) */
        tl.fromTo(g, { opacity: GHOST_OP[i] }, { opacity: 0, duration: 0.06, ease: "power1.in", immediateRender: false }, 1.24);
      }

      /* ===== 1.30 : la phrase s'efface (flou 0 → 8, opacité → 0, 0,2 s) ===== */
      tl.fromTo(type,
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", immediateRender: false },
        1.3);

      /* ===== 1.50 : un point de lumière naît là où était le post-it (1 image avant le repère) ; 1.80 : il s'embrase ===== */
      tl.fromTo(core, { scale: 0.05, opacity: 0 }, { scale: 0.3, opacity: 1, duration: 0.13, ease: "expo.out", immediateRender: false }, 1.47);
      tl.fromTo(h1, { scale: 0.05, opacity: 0 }, { scale: 0.28, opacity: 0.9, duration: 0.19, ease: "expo.out", immediateRender: false }, 1.47);
      tl.fromTo(h2, { scale: 0.1, opacity: 0 }, { scale: 0.3, opacity: 0.6, duration: 0.31, ease: "power3.out", immediateRender: false }, 1.49);
      /* scintillement : le point vit et grossit doucement */
      tl.fromTo(core, { scale: 0.3 }, { scale: 0.42, duration: 0.2, ease: "none", immediateRender: false }, 1.6);
      tl.fromTo(h1, { scale: 0.28 }, { scale: 0.4, duration: 0.14, ease: "none", immediateRender: false }, 1.66);
      tl.fromTo(h1, { opacity: 0.9 }, { opacity: 0.62, duration: 0.07, ease: "sine.inOut", immediateRender: false }, 1.66);
      tl.fromTo(h1, { opacity: 0.62 }, { opacity: 0.95, duration: 0.07, ease: "sine.inOut", immediateRender: false }, 1.73);
      /* embrasement : tailles finales à 1.90 (cœur 40, halos 160 et 520 px), encore en train de grossir */
      tl.fromTo(core, { scale: 0.42 }, { scale: 1, duration: 0.1, ease: "power2.in", immediateRender: false }, 1.8);
      tl.fromTo(h1, { scale: 0.4, opacity: 0.95 }, { scale: 1, opacity: 1, duration: 0.1, ease: "power2.in", immediateRender: false }, 1.8);
      tl.fromTo(h2, { scale: 0.3, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.1, ease: "power2.in", immediateRender: false }, 1.8);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
