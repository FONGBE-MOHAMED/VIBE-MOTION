  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "08-mots";
      var T = 2.91;

      var byId = function (id) { return document.getElementById(id); };
      var toArr = function (list) { return Array.prototype.slice.call(list); };

      var lens = byId("f08-lens"), drift = byId("f08-drift"), camEl = byId("f08-cam"), world = byId("f08-world");
      var dots = byId("f08-dots"), halo = byId("f08-halo"), fg = byId("f08-fg"), prev = byId("f08-prev");
      var hello = byId("f08-hello"), fshadow = byId("f08-fshadow"), fring = byId("f08-fring"), fface = byId("f08-fface");
      var ftext = byId("f08-ftext"), typed = byId("f08-typed"), caret = byId("f08-caret");
      var sendw = byId("f08-sendw"), send = byId("f08-send"), ripple = byId("f08-ripple"), next = byId("f08-next");
      var cur = byId("f08-cur"), curin = byId("f08-curin");
      var sub1 = byId("f08-sub1"), sub2 = byId("f08-sub2"), hlbox = byId("f08-hlbox"), brush = byId("f08-brush");
      var w1 = toArr(sub1.getElementsByClassName("f08-w"));
      var w2 = toArr(sub2.getElementsByClassName("f08-w"));
      var slides = [];
      for (var k = 0; k < 10; k++) slides.push(byId("f08-s" + k));

      /* ---- la demande, tapée lettre à lettre (0.23 à 1.17 : complète à l'image clé 1.18) ---- */
      var FULL = "Prépare ma présentation de lundi à partir de mes notes.";
      var NCH = FULL.length;
      var TYPE0 = 0.23, TYPE1 = 1.17, STEP = (TYPE1 - TYPE0) / (NCH - 1);

      /* ---- whip vers la gauche : 2.73 à 3.08 en expo.inOut (la séquence 9 pose la fin), au sommet du flou à 2.91 ---- */
      var WHIP0 = 2.73, WHIPD = 0.35, WHIPDX = 2400;
      var expoIO = gsap.parseEase("expo.inOut");

      /* ---- curseur : un seul mouvement courbe (x power3.out, y power2.out) qui suit le bouton, posé à 1.78 ---- */
      var CUR0 = 1.36, CURD = 0.42, CSX = 1990, CSY = 760;

      /* état de la caméra et du champ, écrit par les tweens, lu par render() :
         t horloge locale, s échelle, fy point du monde visé (y ; x = 960), b flou caméra en px écran,
         dr recalage de la dérive (masqué par le recul), m morph du champ (plein cadre → barre du haut) */
      var S = { t: 0, s: 2.88, fy: -41.7, b: 10, dr: 0, m: 0 };
      var lastN = -1;

      function mod(a, n) { return ((a % n) + n) % n; }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function px(v) { return v.toFixed(2) + "px"; }

      function render() {
        var t = S.t, s = S.s, fy = S.fy, m = S.m, im = 1 - m;
        /* dérive x +12 px/s, nulle aux deux images clés (1.18 et 2.38) */
        var dx = 12 * (t - 1.18) + S.dr;
        var wx = t > WHIP0 ? WHIPDX * expoIO(clamp01((t - WHIP0) / WHIPD)) : 0;
        var blur = S.b > 0.25 ? "blur(" + S.b.toFixed(2) + "px)" : "none";

        lens.style.filter = blur;
        drift.style.transform = "translate(" + px(dx + wx) + ",0px)";
        camEl.style.transform = "scale(" + s.toFixed(5) + ")";
        world.style.transform = "translate(0px," + px(540 - fy) + ")";
        dots.style.transform = "translate(" + px(mod(dx, 36)) + "," + px(mod((540 - fy) * 0.25, 36)) + ")";

        /* avant-plan : parallaxe ×2,2 sur l'atterrissage (×1,5 sur la dérive), poussé hors champ au recul */
        var r = s / 1.6;
        var sfg = r >= 1 ? 1 + (r - 1) * 2.2 : 1 + (1 - r) * 0.8;
        fg.style.transform = "translate(" + px(dx * 1.5) + ",0px) scale(" + sfg.toFixed(4) + ")";

        /* le champ : 156,25 → 96 de haut (bords nets, rayon 25 → 24, filet 1,25 → 2), texte et bouton à leur place de P15 */
        var ins = 30.125 * m, fi = 1.25 + 30.875 * m, fs = 1.25 + 0.75 * m;
        fring.style.clipPath = "inset(" + px(ins) + " 0px " + px(ins) + " 0px round " + px(25 - m) + ")";
        fface.style.clipPath = "inset(" + px(fi) + " " + px(fs) + " " + px(fi) + " " + px(fs) + " round " + px(23.75 - 1.75 * m) + ")";
        fshadow.style.transform = "scaleY(" + (1 - 0.3856 * m).toFixed(4) + ")";
        ftext.style.transform = "translate(" + px(13 * im) + ",0px) scale(" + (1 + 0.0268 * im).toFixed(4) + ")";
        sendw.style.transform = "translate(" + px(-21.75 * im) + "," + px(1.25 * im) + ") scale(" + (1 + 0.25 * im).toFixed(4) + ")";

        /* frappe */
        var n = t < TYPE0 ? 0 : Math.min(NCH, Math.floor((t - TYPE0) / STEP + 1e-6) + 1);
        if (n !== lastN) { typed.textContent = FULL.slice(0, n); lastN = n; }

        /* curseur : la pointe vise le centre du bouton d'envoi (+6, +5), où que la caméra l'emmène */
        var bx = 1418 - 21.75 * im, by = 118 + 1.25 * im;
        var tx = 960 + (bx - 960) * s + dx + wx + 6;
        var ty = 540 + (by - fy) * s + 5;
        var p = clamp01((t - CUR0) / CURD);
        var ux = 1 - Math.pow(1 - p, 3), uy = 1 - Math.pow(1 - p, 2);
        var cx = CSX + (tx - CSX) * ux, cy = CSY + (ty - CSY) * uy;
        cur.style.transform = "translate(" + px(cx - 4) + "," + px(cy - 3) + ")";
        cur.style.filter = t > 2.5 ? blur : "none";
      }

      /* proxys getter/setter : chaque écriture d'une tween de caméra rappelle render() (indépendant de onUpdate) */
      function P(key) {
        return function (v) {
          if (arguments.length) { S[key] = v; render(); return; }
          return S[key];
        };
      }
      var C = { t: P("t"), s: P("s"), fy: P("fy"), b: P("b"), dr: P("dr"), m: P("m") };

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ================= PISTE CAMÉRA ================= */
      tl.fromTo(C, { t: 0 }, { t: T, duration: T, ease: "none" }, 0);
      /* 0.00 à 0.18 : le cran se pose (le champ monte du bas, ×1,8 → plein cadre, flou 10 → 0) */
      tl.fromTo(C, { s: 2.88, fy: -41.7 }, { s: 1.6, fy: 171.125, duration: 0.18, ease: "expo.out" }, 0);
      tl.fromTo(C, { b: 10 }, { b: 0, duration: 0.18, ease: "power2.out" }, 0);
      /* 1.53 à 1.83 : recul expo.out, le champ rétrécit en haut ; la dérive se recale sous le mouvement */
      tl.fromTo(C, { s: 1.6, fy: 171.125, dr: 0 }, { s: 1, fy: 540, dr: -14.4, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.53);
      tl.fromTo(C, { b: 0 }, { b: 3, duration: 0.07, ease: "power1.in", immediateRender: false }, 1.53);
      tl.fromTo(C, { b: 3 }, { b: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, 1.6);
      /* 2.73 : whip vers la gauche, flou 0 → 12 px au sommet (2.89) */
      tl.fromTo(C, { b: 0 }, { b: 12, duration: 0.16, ease: "power2.in", immediateRender: false }, 2.73);

      /* ================= OBJETS ================= */
      /* le champ devient la barre du haut de P15 (même objet) */
      tl.fromTo(C, { m: 0 }, { m: 1, duration: 0.27, ease: "power3.out", immediateRender: false }, 1.53);
      tl.fromTo(halo, { scaleX: 1, scaleY: 1, y: 0 }, { scaleX: 1.1176, scaleY: 0.9, y: 30, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.53);

      /* les trois cartes de la séquence 7 finissent de sortir par le haut, filées */
      tl.fromTo(prev, { y: -660, scale: 1.3 }, { y: -1500, duration: 0.12, ease: "none" }, 0);
      tl.set(prev, { autoAlpha: 0 }, 0.14);

      /* bouton et caret présents dès la première image (hors champ, à gauche et à droite du champ géant) */
      tl.fromTo([sendw, caret], { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      /* l'accueil flou au fond */
      tl.fromTo(hello, { opacity: 0 }, { opacity: 0.4, duration: 0.3, ease: "power1.out", immediateRender: false }, 0.1);
      /* avant-plan : allumé hors champ, il entre avec l'atterrissage ; il sort au recul */
      tl.set(fg, { opacity: 1 }, 0.04);
      tl.fromTo(fg, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, 1.53);

      /* 1.38 le caret clignote ; il s'éteint à l'envoi */
      tl.set(caret, { opacity: 0 }, 1.38);
      tl.set(caret, { opacity: 1 }, 1.48);
      tl.fromTo(caret, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in", immediateRender: false }, 1.86);

      /* curseur : allumé hors champ à droite, posé à 1.78, clic direct à 1.86 (pression + onde jaune) */
      tl.set(cur, { opacity: 1 }, CUR0);
      tl.fromTo(curin, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in", immediateRender: false }, 1.86);
      tl.fromTo(curin, { scale: 0.85 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 1.92);
      tl.fromTo(send, { scale: 1 }, { scale: 0.92, duration: 0.06, ease: "power2.in", immediateRender: false }, 1.86);
      tl.fromTo(send, { scale: 0.92 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 1.92);
      tl.set(ripple, { opacity: 0.95 }, 1.86);
      tl.fromTo(ripple, { scale: 0.45 }, { scale: 1.05, duration: 0.9, ease: "power3.out", immediateRender: false }, 1.86);
      tl.fromTo(ripple, { opacity: 0.95 }, { opacity: 0, duration: 0.75, ease: "power3.in", immediateRender: false }, 1.95);
      /* envoyée : la demande passe au gris de P15 */
      tl.fromTo(ftext, { color: "#17181c" }, { color: "#55565c", duration: 0.2, ease: "power1.inOut", immediateRender: false }, 1.88);

      /* 1.93 : dix diapos arrivent de la caméra (×1,35, flou 8 → net) et se rangent en grille 5 × 2 */
      for (var i = 0; i < 10; i++) {
        tl.fromTo(slides[i],
          { opacity: 0.75, scale: 1.35, x: -40, y: -54, filter: "blur(8px)" },
          { opacity: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false },
          1.93 + i * 0.055);
      }

      /* le champ de la séquence 9 attend à gauche du monde ; le whip l'amène */
      tl.set(next, { opacity: 1 }, 2.5);

      /* ================= SOUS-TITRES ================= */
      var INK = "#17181c", INK_GRAY = "rgba(23,24,28,0.35)";
      function word(el, t) {
        tl.fromTo(el,
          { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false },
          t);
        tl.fromTo(el, { color: INK_GRAY }, { color: INK, duration: 0.2, ease: "power1.inOut", immediateRender: false }, t + 0.1);
      }
      /* « Tu lui expliques [avec tes mots]… » : chaque mot une image avant son temps */
      var CUES1 = [0.22, 0.39, 0.65, 0.85, 1.06, 1.3, 1.36];
      for (i = 0; i < w1.length; i++) word(w1[i], CUES1[i] - 0.03);
      tl.fromTo(hlbox, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.83);
      tl.fromTo(sub1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.6);
      /* « elle fait [le travail]. » ; le trait jaune de 2.23 à 2.63 ; sorti à 2.80, avant le whip (2.73) n'atteigne la couture */
      var CUES2 = [1.89, 2.06, 2.23, 2.39, 2.47];
      for (i = 0; i < w2.length; i++) word(w2[i], CUES2[i] - 0.03);
      tl.fromTo(brush, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.23);
      tl.fromTo(sub2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 2.66);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
