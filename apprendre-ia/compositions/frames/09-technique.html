  <script>
    (function () {
      var FID = "09-technique";
      var T = 3.33;
      var byId = function (id) { return document.getElementById(id); };
      var NO = false; /* immediateRender des tweens qui commencent après 0 */

      var drift = byId("f09-drift"), cam = byId("f09-cam"), world = byId("f09-world");
      var grid = byId("f09-grid"), win = byId("f09-win"), dots = byId("f09-dots");
      var wincard = byId("f09-wincard"), winhead = byId("f09-winhead");
      var hdot = byId("f09-hdot"), ring = byId("f09-ring");
      var b1 = byId("f09-b1"), b2 = byId("f09-b2"), b3 = byId("f09-b3");
      var fshadow = byId("f09-fshadow"), ftxt = byId("f09-ftxt"), fph = byId("f09-fph"), caret = byId("f09-caret");
      var card = byId("f09-card"), gh1 = byId("f09-gh1"), gh2 = byId("f09-gh2"), streak = byId("f09-streakblur");
      var hlbg = byId("f09-hlbg"), pksvg = byId("f09-pksvg"), pkdraw = byId("f09-pkdraw");

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false } });

      /* =====================================================================================

         Le monde est le cadrage de P17 à l'échelle 1 (fenêtre 360..1560 × 90..830, champ 410..1510 × 610..720).
         ===================================================================================== */
      var CAM = gsap.timeline();
      /* 0.00 → 0.17 : fin du whip vers la gauche (power3.out) : le champ, entré par la gauche, se pose à droite
         (écran 608..1840 × 313..437, ×1,12) ; la grille file vers la droite et sort */
      CAM.fromTo(world, { x: -842.9, y: -272.3 }, { x: 235.7, y: -272.3, duration: 0.17, ease: "power3.out" }, 0);
      CAM.fromTo(cam, { scale: 1.12 }, { scale: 1.12, duration: 0.17, ease: "none" }, 0);
      /* flou du whip (12 px écran) : divisé par l'échelle cumulée, posé sur chaque objet (< 1800 px) */
      CAM.fromTo(win, { filter: "blur(10.7px)" }, { filter: "blur(0px)", duration: 0.17, ease: "power3.out" }, 0);
      CAM.fromTo(grid, { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.17, ease: "power3.out" }, 0);
      /* 0.17 → 1.42 : dérive (poussée 2 %/s + 18 px vers la gauche) */
      CAM.fromTo(world, { x: 235.7 }, { x: 219.7, duration: 1.25, ease: "none", immediateRender: NO }, 0.17);
      CAM.fromTo(cam, { scale: 1.12 }, { scale: 1.145, duration: 1.25, ease: "none", immediateRender: NO }, 0.17);
      /* 1.42 → 1.67 : recul expo.out jusqu'au cadrage de P17 (×0,978, l'identité à 2.77) */
      CAM.fromTo(world, { x: 219.7, y: -272.3 }, { x: 0, y: 0, duration: 0.25, ease: "expo.out", immediateRender: NO }, 1.42);
      CAM.fromTo(cam, { scale: 1.145 }, { scale: 0.978, duration: 0.25, ease: "expo.out", immediateRender: NO }, 1.42);
      CAM.fromTo(win, { filter: "blur(0px)" }, { filter: "blur(3.5px)", duration: 0.03, ease: "none", immediateRender: NO }, 1.42);
      CAM.fromTo(win, { filter: "blur(3.5px)" }, { filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: NO }, 1.45);
      /* 1.67 → 3.12 : poussée 2 %/s (×0,978 → ×1,007) */
      CAM.fromTo(cam, { scale: 0.978 }, { scale: 1.007, duration: 1.45, ease: "none", immediateRender: NO }, 1.67);
      /* 3.12 → 3.33 : recul power2.in, la fenêtre rétrécit au centre jusqu'à ×0,6, flou 0 → 12 px écran (20 / 0,6) */
      CAM.fromTo(cam, { scale: 1.007 }, { scale: 0.6, duration: 0.21, ease: "power2.in", immediateRender: NO }, 3.12);
      CAM.fromTo(win, { filter: "blur(0px)" }, { filter: "blur(20px)", duration: 0.21, ease: "power2.in", immediateRender: NO }, 3.12);
      /* dérive de fond : jamais d'arrêt */
      CAM.fromTo(drift, { x: 0, y: 0 }, { x: -10, y: -6, duration: T, ease: "none" }, 0);
      CAM.fromTo(dots, { x: 0 }, { x: -24, duration: T, ease: "none" }, 0);
      tl.add(CAM, 0);

      /* la grille est hors champ dès 0.17 ; on l'éteint pour qu'elle ne revienne pas au recul final */
      tl.set(grid, { opacity: 0, immediateRender: NO }, 0.3);

      /* =====================================================================================
         SCÈNE 1 (0.00 → 1.57) : P16, « Pas besoin d’être [technique] : »

      /* 0.17 : la carte de code arrive de la caméra, à gauche (×1,3, flou 10 → net en 0,14 s), par-dessus le champ */
      tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out", immediateRender: NO }, 0.17);
      tl.fromTo(card, { x: -320, y: 24, scale: 1.3, rotation: -5 },

      /* tenue vivante : la carte (avant-plan) glisse plus vite que le monde */

      gsap.set([gh1, gh2], { x: -12, y: -4 });

      /* 0.98 (« technique » à 1.03, l'image devance de 1,5 image) : la carte bascule 0° → -16° (0,15 s power2.in)

         traînée de 2 échos (motion-blur-streak, voie B) */
      var FALL = 0.98;
      tl.fromTo(card, { rotation: 0 }, { rotation: -16, duration: 0.15, ease: "power2.in", immediateRender: NO }, FALL);
      tl.fromTo(card, { x: -12, y: -4 }, { x: -840, y: 756, duration: 0.35, ease: "power1.in", immediateRender: NO }, FALL);
      tl.fromTo(streak, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "0 9" }, duration: 0.35, ease: "none", immediateRender: NO }, FALL);
      tl.set(card, { opacity: 0, immediateRender: NO }, FALL + 0.38);

        var el = g[0], lag = g[1];
        tl.fromTo(el, { opacity: 0 }, { opacity: g[2], duration: 0.05, ease: "none", immediateRender: NO }, FALL + 0.03);
        tl.fromTo(el, { rotation: 0 }, { rotation: -16, duration: 0.15, ease: "power2.in", immediateRender: NO }, FALL + lag);
        tl.fromTo(el, { x: -12, y: -4 }, { x: -840, y: 756, duration: 0.35, ease: "power1.in", immediateRender: NO }, FALL + lag);
        /* les échos ne vivent que le début de la chute (P16), puis s'éteignent : le flou vertical prend le relais */
        tl.fromTo(el, { opacity: g[2] }, { opacity: 0, duration: 0.1, ease: "power1.in", immediateRender: NO }, FALL + 0.17);
      });

      /* =====================================================================================
         SCÈNE 2 (1.57 → 3.33) : P17, « il faut juste [apprendre à lui parler]. »
         ===================================================================================== */
      /* 1.47 : pendant le recul, la fenêtre « Assistant IA » se révèle autour du champ */
      tl.fromTo([wincard, winhead], { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: NO }, 1.47);
      tl.fromTo([wincard, winhead], { scale: 1.03, transformOrigin: "600px 370px" },
        { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: NO }, 1.47);
      tl.fromTo(fshadow, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.out", immediateRender: NO }, 1.47);
      /* 1.50 : la demande part (envoyée) ; 1.62 : le champ redevient vide, caret jaune */
      tl.fromTo(ftxt, { y: 0, opacity: 1 }, { y: -14, opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: NO }, 1.5);
      tl.fromTo(fph, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: NO }, 1.62);
      [[2.05, 0], [2.35, 1], [2.9, 0], [3.12, 1]].forEach(function (k) {
        tl.set(caret, { opacity: k[1], immediateRender: NO }, k[0]);
      });

      /* les bulles montent (y 20 → 0, 0,12 s) : 1.67 toi, 2.07 l'IA, 2.47 toi */
      function bubble(el, t, origin) {
        tl.fromTo(el, { opacity: 0, y: 20, scale: 0.96, transformOrigin: origin },
          { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "power3.out", immediateRender: NO }, t);
      }
      bubble(b1, 1.67, "100% 100%");
      bubble(b2, 2.07, "0% 100%");
      bubble(b3, 2.47, "100% 100%");

      /* 2.87 : le point de l'IA pulse */
      tl.fromTo(hdot, { scale: 1 }, { scale: 1.7, duration: 0.1, ease: "power2.out", immediateRender: NO }, 2.87);
      tl.fromTo(hdot, { scale: 1.7 }, { scale: 1, duration: 0.24, ease: "power2.inOut", immediateRender: NO }, 2.97);
      tl.fromTo(ring, { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 3.4, duration: 0.36, ease: "power2.out", immediateRender: NO }, 2.87);

      /* =====================================================================================
         SOUS-TITRE : chaque mot sur son horodatage (1 image avant), gris (35 %) puis encre pleine ; sortie 0,14 s
         ===================================================================================== */
      function word(id, cue) {
        var el = byId(id), t = cue - 0.033;
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: NO }, t);
        tl.fromTo(el, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.inOut", immediateRender: NO }, t + 0.14);
      }
      function out(ids, t) {
        var els = ids.map(byId);
        tl.fromTo(els, { opacity: 1, filter: "blur(0px)" },
          { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: NO }, t);
      }

      /* phrase 1 */
      word("f09-s1a", 0.23);
      word("f09-s1b", 0.43);
      word("f09-s1c", 0.78);
      /* 1.01 : le surligneur se trace depuis la gauche (0,16 s power3.out), 2 images avant « technique » */
      tl.fromTo(hlbg, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: NO }, 1.01);
      word("f09-s1d", 1.03);
      word("f09-s1e", 1.03);
      out(["f09-s1a", "f09-s1b", "f09-s1c", "f09-s1hl", "f09-s1e"], 1.44);

      /* phrase 2 */
      word("f09-s2a", 1.61);
      word("f09-s2b", 1.77);
      word("f09-s2c", 1.96);
      word("f09-s2d", 2.23);
      word("f09-s2e", 2.38);
      word("f09-s2f", 2.62);
      word("f09-s2g", 2.79);
      word("f09-s2h", 2.79);

      var len = 0;

      out(["f09-s2a", "f09-s2b", "f09-s2c", "f09-s2pk", "f09-s2h"], 3.07);

      tl.set({}, {}, T);

      window.__timelines = window.__timelines || {};
