  <script>
    (function () {

      /* ---- les trois horloges de la douleur, remontées à rebours ----
         angles en degrés, sens horaire depuis midi. Un seul proxy p (0 → 1, power2.inOut) par horloge pilote
         l'aiguille des heures, celle des minutes, la trotteuse et l'heure numérique.
         Le secteur jaune du temps rendu est la dernière course de L degrés de l'aiguille des minutes :
         ancré en Ef + L, son bord libre suit l'aiguille jusqu'à Ef (tuile 1 : 0 → 167°, tuile 2 : 180 → 360°,
         tuile 3 : tout le cadran), soit exactement le dessin de P18 à la fin. */
      var CL = [
        { k: 1, H0: 323.5, H1: 180, M0: 282, M1: -360, Ef: 0,   L: 167,   Send: 0,   R: 720, T0: 1367, T1: 1080, t0: 1.14, dur: 0.60 }, // 22:47 → 18:00
        { k: 2, H0: 360,   H1: 255, M0: 360, M1: -180, Ef: 180, L: 180,   Send: 180, R: 720, T0: 720,  T1: 510,  t0: 1.79, dur: 0.60 }, // 12:00 → 08:30
        { k: 3, H0: 195,   H1: -60, M0: 180, M1: -360, Ef: 0,   L: 359.5, Send: 0,   R: 540, T0: null, T1: null, t0: 2.48, dur: 0.38 }  // DIM. 18:30 → 10:00
      ];
      CL.forEach(function (c) {

        c.tEnd = c.t0 + c.dur;
        c.h = $("f10-h" + c.k); c.m = $("f10-m" + c.k); c.s = $("f10-s" + c.k); c.w = $("f10-w" + c.k); c.d = $("f10-d" + c.k);

      var P = { t: 0 };                                  // horloge de la séquence (trotteuses vivantes, flottement)

      var FL = [

      function pt(a) {
        var r = a * Math.PI / 180;
        return (140 + 114 * Math.sin(r)).toFixed(2) + " " + (140 - 114 * Math.cos(r)).toFixed(2);
      }
      function sector(a, b) {                           // arc SVG de a à b (sens horaire), comme dans P18
        var span = b - a;
        if (span < 0.25) return "M140 140Z";

      function hhmm(v) {
        var h = Math.floor(v / 60) % 24, m = v % 60;
        return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
      }

      function render() {
        drift.style.transform = "scale(" + CAM.sd.toFixed(5) + ")";
        cam.style.transform = "scale(" + CAM.s.toFixed(5) + ")";
        world.style.transform = "translate(" + CAM.wx.toFixed(2) + "px," + CAM.wy.toFixed(2) + "px)";

        var env = Math.min(1, Math.max(0, (P.t - 0.26) / 0.4));
        env = env * env * (3 - 2 * env);
        for (var j = 0; j < FL.length; j++) {
          var fy = -4 * env * Math.sin(2 * Math.PI * (P.t - 0.26 + FL[j].ph) / FL[j].T);
          FL[j].el.style.transform = "translateY(" + fy.toFixed(2) + "px)";
        }

        for (var i = 0; i < CL.length; i++) {
          var c = CL[i], e = c.p;
          var mAng = c.M0 + (c.M1 - c.M0) * e;
          rot(c.h, c.H0 + (c.H1 - c.H0) * e);
          rot(c.m, mAng);
          rot(c.s, c.Send + 6 * (P.t - c.tEnd) + c.R * (1 - e));   // trotteuse : avance de 6°/s, recule pendant la remontée
          var r = mAng - c.M1, d = (r < c.L) ? sector(c.Ef + r, c.Ef + c.L) : "M140 140Z";

      });

      tl.fromTo(CAM, { s: st.s, wx: 960 - st.cx, wy: 540 - st.cy },

      tl.fromTo(tilesBox, { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.18, ease: "power2.in", immediateRender: false }, 3.24);

      /* ===== la tuile active se soulève (sujet), les deux autres restent posées (milieu) ===== */

        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(8px)" },

      // 3.04 : les trois tuiles respirent (une inspiration, une expiration, décalées de 0,03 s)
      [1, 2, 3].forEach(function (k, i) {
        var el = $("f10-t" + k + "-in"), t = 3.04 + 0.03 * i, s0 = k === 3 ? 1.02 : 1, y0 = k === 3 ? -6 : 0;
        tl.fromTo(el, { scale: s0, y: y0 }, { scale: 1.015, y: -3, duration: 0.16, ease: "sine.inOut", immediateRender: false }, t);
        tl.fromTo(el, { scale: 1.015, y: -3 }, { scale: 1, y: 0, duration: 0.16, ease: "sine.inOut", immediateRender: false }, t + 0.16);
      });

      /* ===== le sous-titre : mot par mot, gris (encre à 35 %) puis encre pleine ===== */
      Array.prototype.forEach.call(document.querySelectorAll("#f10-subs .w"), function (w) {
        var t = parseFloat(w.getAttribute("data-cue")) - 0.03;
        tl.fromTo(w, { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(w, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, t + 0.14);
      });
      // [boîte : tu récupères] tracée depuis la gauche à 0.39
      tl.fromTo($("f10-box"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.39);
      // 1.54 : le second morceau remplace le premier ; 3.18 : le sous-titre sort
      tl.fromTo($("f10-line1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.54);
      tl.fromTo($("f10-line2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 3.18);

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
