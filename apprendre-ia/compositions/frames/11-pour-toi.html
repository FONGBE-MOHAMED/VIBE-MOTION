  <script>
    (function () {
      var FID = "11-pour-toi";
      var D = 3.54;
      var FR = 1 / 30;
      function byId(id) { return document.getElementById(id); }
      function toArr(list) { return Array.prototype.slice.call(list); }

      var drift = byId("f11-drift"), cam = byId("f11-cam"), world = byId("f11-world"), bg = byId("f11-bg");
      var set = byId("f11-set"), tiles = byId("f11-tiles"), dots = byId("f11-dots"), halo = byId("f11-halo");
      var ai = byId("f11-ai"), veil = byId("f11-veil"), caret = byId("f11-caret");
      var postit = byId("f11-postit"), curl = byId("f11-curl"), pen = byId("f11-pen");
      var strikeSvg = byId("f11-strike"), strikePath = byId("f11-strike-path");
      var sub1 = byId("f11-sub1"), sub2 = byId("f11-sub2"), hl = byId("f11-hl");
      var pkSvg = byId("f11-pk").getElementsByTagName("svg")[0];
      var words = toArr(document.querySelectorAll("#f11-subs .f11-w"));

      /* ---- repères du monde (cadrage du styleframe P19 : caméra ×1 centrée sur 960, 540) ---- */
      var O = { x: 965, y: 265 };                 // origine du post-it (50 % 10 %) : left 815 + 150, top 235 + 30
      var RAD = (-5 * Math.PI) / 180;             // le post-it posé : -5°
      function onNote(lx, ly) {                   // repère du post-it -> monde
        var dx = lx - 150, dy = ly - 30;
        return { x: O.x + dx * Math.cos(RAD) - dy * Math.sin(RAD), y: O.y + dx * Math.sin(RAD) + dy * Math.cos(RAD) };
      }
      var PC = onNote(150, 150);                  // centre du post-it posé (975,5 ; 384,5)
      var Z = onNote(117.5, 258);                 // zone jaune vierge sous « moi » (encre : « moi » finit en y 207, bord en 300) : cible de la poussée finale
      var PAR = 0.304;                            // le fond pousse moins que le sujet : s_fond = 1 + (s - 1) × PAR
      var S_END = 70;                             // poussée finale (power2.in, cubique) : à 3.50 déjà ×19, le cadre est tout jaune dans les deux dernières images
      var PEN_K = 1 / 2.15;                       // le feutre de P20 (60 × 420 px à l'écran pour un post-it à ×2,15)
      var PEN_ROT = 33;                           // 28° à l'écran dans P20 = 33° dans le repère du post-it (-5°)
      var REST = { x: 321, y: 68 };               // pointe du feutre posé (image clé P20), repère du post-it

      /* ---- le trait sur « Pas » : échantillonné par longueur d'arc (géométrie seule, aucune mesure de mise en page) ---- */
      var SEG = [[4, 34, 30, 30, 60, 27, 90, 26], [90, 26, 112, 25, 132, 22, 146, 18]];
      var pts = [], cum = [0];
      SEG.forEach(function (c, si) {
        for (var i = si === 0 ? 0 : 1; i <= 60; i++) {
          var t = i / 60, u = 1 - t;
          pts.push([u * u * u * c[0] + 3 * u * u * t * c[2] + 3 * u * t * t * c[4] + t * t * t * c[6],
                    u * u * u * c[1] + 3 * u * u * t * c[3] + 3 * u * t * t * c[5] + t * t * t * c[7]]);
        }
      });
      for (var j = 1; j < pts.length; j++) cum.push(cum[j - 1] + Math.sqrt(Math.pow(pts[j][0] - pts[j - 1][0], 2) + Math.pow(pts[j][1] - pts[j - 1][1], 2)));
      var ARC = cum[cum.length - 1];
      function head(p) {                          // pointe du trait à la fraction p, repère du post-it (svg en 24, 84)
        var d = Math.max(0, Math.min(1, p)) * ARC, i = 1;
        while (i < cum.length - 1 && cum[i] < d) i++;
        var a = cum[i - 1], b = cum[i], k = b > a ? (d - a) / (b - a) : 0;
        return { x: 24 + pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, y: 84 + pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k };
      }
      var S0 = head(0), S1 = head(1);
      // svg-path-draw : dasharray = longueur mesurée
      var LEN = ARC;
      try { var gl = strikePath.getTotalLength(); if (gl > 1) LEN = gl; } catch (e) {}
      strikePath.style.strokeDasharray = LEN.toFixed(2);
      strikePath.style.strokeDashoffset = LEN.toFixed(2);

      /* ---- le proxy : caméra, flous, feutre, trait ; UN seul écrivain (render) ----
         s : échelle caméra du sujet ; (tx, ty) : point du monde visé ; (ax, ay) : où il tombe à l'écran ;
         f : poussée finale ; land / dof / tile / pib / fgb / pb : flous en px écran ;
         px, py : pointe du feutre (repère du post-it, hors trait) ; draw : trait sur « Pas » ; pl, pr : lever, rotation */
      var P = { s: 1.1, tx: 960, ty: 540, ax: 960, ay: 540, f: 0,
                land: 12, dof: 0, tile: 12, pib: 16, fgb: 0,
                px: S0.x + 800, py: S0.y - 150, draw: 0, pl: 1.08, pr: 14, pb: 8 };

      function blur(el, px) { el.style.filter = px > 0.05 ? "blur(" + px.toFixed(2) + "px)" : "none"; }

      function render() {
        var s = P.s, tx = P.tx, ty = P.ty, ax = P.ax, ay = P.ay;
        if (P.f > 0) {
          // poussée dans le jaune : échelle interpolée en log ; la zone vierge glisse au centre du cadre
          var sf = Math.exp(Math.log(s) + P.f * (Math.log(S_END) - Math.log(s)));
          var zx0 = ax + s * (Z.x - tx), zy0 = ay + s * (Z.y - ty), g = (1 - P.f) * (1 - P.f);
          var zx = 960 + (zx0 - 960) * g, zy = 540 + (zy0 - 540) * g;
          tx = Z.x - (zx - ax) / sf;
          ty = Z.y - (zy - ay) / sf;
          s = sf;
        }
        var sb = 1 + (s - 1) * PAR, k = sb / s;
        world.style.transform = "translate(" + (960 - tx + (ax - 960) / s).toFixed(3) + "px," + (540 - ty + (ay - 540) / s).toFixed(3) + "px)";
        cam.style.transform = "scale(" + s.toFixed(5) + ")";
        bg.style.transform = "translate(" + ((1 - k) * tx).toFixed(3) + "px," + ((1 - k) * ty).toFixed(3) + "px) scale(" + k.toFixed(5) + ")";

        blur(set, (P.land + P.dof) / sb);
        blur(tiles, P.tile / (sb * (gsap.getProperty(tiles, "scale") || 1)));
        var ps = gsap.getProperty(postit, "scale") || 1;
        blur(postit, (P.pib + P.fgb) / (s * ps));
        postit.style.boxShadow = s > 9 ? "none" : "";

        // le feutre : sa pointe suit la tête du trait pendant qu'il barre « Pas »
        var h = head(P.draw);
        var penX = P.px + h.x - S0.x, penY = P.py + h.y - S0.y;
        pen.style.transform = "translate(" + penX.toFixed(2) + "px," + penY.toFixed(2) + "px) rotate(" + (PEN_ROT + P.pr).toFixed(2) + "deg) scale(" + (PEN_K * P.pl).toFixed(4) + ")";
        blur(pen, P.pb / (s * ps * PEN_K * P.pl));

        strikePath.style.strokeDashoffset = (LEN * (1 - P.draw)).toFixed(2);
        strikeSvg.style.opacity = P.draw > 0.002 ? 1 : 0;
      }

      gsap.set(tiles, { transformOrigin: "960px 460px" });
      gsap.set(curl, { transformOrigin: "100% 100%" });
      gsap.set(pkSvg, { transformOrigin: "0% 50%" });

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ===================== piste caméra ===================== */
      // dérive : la caméra longe la frise vers la droite (-10 px/s), puis Scene 2 pousse de 1,5 %/s
      tl.fromTo(drift, { x: 0 }, { x: -16, duration: 1.62, ease: "none" }, 0);
      tl.fromTo(drift, { scale: 1 }, { scale: 1 + 0.015 * (D - 1.62), duration: D - 1.62, ease: "none", immediateRender: false }, 1.62);
      // 0.00 → 0.22 atterrissage : le recul de la séquence 10 se pose (×1,1 → ×1, flou 12 → 0)
      tl.fromTo(P, { s: 1.1 }, { s: 1, duration: 0.22, ease: "expo.out" }, 0);

      // 1.32 → 1.62 poussée ×1 → ×2,1 sur le post-it (expo.inOut) ; le fond, plus loin, pousse moins (×1,33)

      tl.fromTo(P, { fgb: 0 }, { fgb: 6, duration: D - 3.27, ease: "power2.in", immediateRender: false }, 3.27);

      // 0.00 → 0.22 les tuiles rentrent dans l'écran (elles continuent de rétrécir, floues, et s'y fondent)
      tl.fromTo(tiles, { scale: 0.854, y: 11.7 }, { scale: 0.55, y: -79, duration: 0.22, ease: "power2.out" }, 0);
      tl.fromTo(tiles, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, 0.06);
      tl.fromTo(P, { tile: 12 }, { tile: 8, duration: 0.22, ease: "none" }, 0);

      tl.fromTo(set, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false }, 0.04);
      tl.fromTo(ai, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, 0.1);

      // 0.22 le surligneur se trace (0,16 s power3.out), juste avant « L’intelligence »
      tl.fromTo(hl, { "--f11-k": 0 }, { "--f11-k": 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.22);

      // 0.42 le post-it arrive de la caméra (×2,6, flou 16, depuis le bas à droite), passe par l'image clé P19
      // (×1,25, -14°, flou 5, 0.52) et se colle : -14° → -5°, posé en 0,12 s expo.out, tassement 0,97 → 1 en 0,08 s
      tl.fromTo(postit, { x: 300, y: 230, scale: 2.6, rotation: -18, opacity: 0 },
        { x: 55, y: -5, scale: 1.25, rotation: -14, opacity: 0.9, duration: 0.1, ease: "power2.in", immediateRender: false }, 0.42);
      tl.fromTo(P, { pib: 16 }, { pib: 5, duration: 0.1, ease: "power2.in", immediateRender: false }, 0.42);
      tl.fromTo(postit, { x: 55, y: -5, scale: 1.25, rotation: -14, opacity: 0.9 },
        { x: 0, y: 0, scale: 0.97, rotation: -5, opacity: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, 0.52);
      tl.fromTo(P, { pib: 5 }, { pib: 0, duration: 0.12, ease: "expo.out", immediateRender: false }, 0.52);
      tl.fromTo(postit, { scale: 0.97 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.64);

      // vie : le caret cligne une fois, le coin du post-it se soulève puis retombe
      tl.fromTo(caret, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: false }, 0.62);
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, 1.02);
      tl.fromTo(curl, { scale: 1 }, { scale: 1.14, duration: 0.3, ease: "sine.inOut", immediateRender: false }, 0.98);
      tl.fromTo(curl, { scale: 1.14 }, { scale: 1, duration: 0.3, ease: "sine.inOut", immediateRender: false }, 1.28);

      // 1.32 → 1.62 mise au point sur le post-it : l'écran s'éteint en gris, recule, flou 0 → 6 px, atténué à 55 %
      tl.fromTo(P, { dof: 0 }, { dof: 6, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 1.32);
      tl.fromTo(set, { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 1.32);
      tl.fromTo(veil, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 1.32);

      /* ===================== Scene 2 (1.62 à 3.54) : « Cette fois… c’est pour toi. » ===================== */
      // 1.82 « Cette fois » : le feutre noir entre par la droite et vient au-dessus de « Pas »
      tl.fromTo(pen, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none", immediateRender: false }, 1.82);
      tl.fromTo(P, { px: S0.x + 800, py: S0.y - 150, pr: 14, pb: 8 },
        { px: S0.x, py: S0.y - 10, pr: 0, pb: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.82);
      // 2.30 → 2.42 il se pose sur le papier
      tl.fromTo(P, { py: S0.y - 10, pl: 1.08 }, { py: S0.y, pl: 1, duration: 0.12, ease: "power2.in", immediateRender: false }, 2.3);
      // 2.42 il barre « Pas » : le trait se dessine en 0,25 s power2.out, la pointe le suit ; il reste « pour moi »
      tl.fromTo(P, { draw: 0 }, { draw: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 2.42);
      tl.fromTo(P, { pr: 0 }, { pr: -3, duration: 0.25, ease: "power1.inOut", immediateRender: false }, 2.42);
      // 2.67 → 2.95 il se lève et se range sur le bord droit (pose de l'image clé P20)
      tl.fromTo(P, { px: S0.x, py: S0.y, pr: -3 },
        { px: REST.x - (S1.x - S0.x), py: REST.y - (S1.y - S0.y), pr: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, 2.67);
      tl.fromTo(P, { pl: 1 }, { pl: 1.05, duration: 0.1, ease: "power2.out", immediateRender: false }, 2.67);
      tl.fromTo(P, { pl: 1.05 }, { pl: 1, duration: 0.12, ease: "power2.inOut", immediateRender: false }, 2.85);
      // 3.12 le feutre sort par la droite (plus vite qu'il n'est entré)
      tl.fromTo(P, { px: REST.x - (S1.x - S0.x), py: REST.y - (S1.y - S0.y), pr: 0, pb: 0 },
        { px: REST.x - (S1.x - S0.x) + 760, py: REST.y - (S1.y - S0.y) - 60, pr: 8, pb: 8, duration: 0.14, ease: "power2.in", immediateRender: false }, 3.12);
      tl.fromTo(pen, { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, 3.27);

      /* ===================== sous-titre ===================== */
      // chaque mot sur son horodatage (1 image avant) : gris, y 8, flou 6 → net en 0,14 s, puis encre pleine en 0,2 s
      function word(el, t) {
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(el, { color: "rgba(23, 24, 28, 0.35)" },
          { color: "#17181c", duration: 0.2, ease: "power1.inOut", immediateRender: false }, t + 0.1);
      }
      words.forEach(function (w) { word(w, Math.max(0, parseFloat(w.getAttribute("data-cue")) - FR)); });
      // la phrase 1 sort pendant la poussée
      tl.fromTo(sub1, { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.44);
      // 2.92 → 3.32 le trait jaune sous « pour toi »
      tl.fromTo(pkSvg, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.92);
      // la phrase 2 sort avant la couture : aucun sous-titre dans les deux dernières images
      tl.fromTo(sub2, { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(6px)", duration: 0.13, ease: "power2.in", immediateRender: false }, 3.33);

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
