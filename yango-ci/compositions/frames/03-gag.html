      at(q("tag"), { opacity: 0, scale: 1.6, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .12, ease: "expo.out" }, .07);
      swing(q("tag"), .19, [0, -6, 4.5, -3, 1.5, 0], .12);

      // 0.27 « Trois » : la bulle sort de la vitre ; le chauffeur parle
      at(q("bub"), { opacity: 0, scale: .25, x: 90, y: 120, filter: "blur(6px)" }, { opacity: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: .14, ease: "expo.out" }, .27);
      at(q("taxi-drv"), { y: 0 }, { y: -5, duration: .07, ease: "power2.out" }, .27);
      at(q("taxi-drv"), { y: -5 }, { y: 0, duration: .12, ease: "power2.inOut" }, .34);
      at(q("taxi-drv"), { y: 0 }, { y: -4, duration: .06, ease: "power2.out" }, .50);
      at(q("taxi-drv"), { y: -4 }, { y: 0, duration: .1, ease: "power2.inOut" }, .56);
      K.subIn(tl, "s1", [.27, .52], { box: [0, 1] });
      K.subOut(tl, "s1", .76, .14);
      at(q("bub"), { opacity: 1, scale: 1, y: 0 }, { opacity: 0, scale: .7, y: 30, duration: .1, ease: "power2.in" }, .80);

      // 0.75 le héros baisse les yeux vers ses vêtements (les copies, encore cachées, ont la même pose)
      ["hero", "c2", "c3"].forEach(function (a) {
        at(q(a + "-head"), { y: 0 }, { y: 7, duration: .15, ease: "power3.out" }, .75);
        at(q(a + "-eyes"), { y: 0 }, { y: 4, duration: .15, ease: "power3.out" }, .75);
      });

      // Scene 2 · 0.90 le héros glisse à gauche, deux copies naissent de lui à sa droite (décalage 0,08 s)
      function slide(a, tg, dx, t, blur) {
        at(q(a), { x: 0, scaleX: 1.07, filter: "blur(" + blur + "px)" }, { x: dx, scaleX: 1, filter: "blur(0px)", duration: .35, ease: "expo.out" }, t);
        at(q(tg), { x: 0, y: 0 }, { x: dx, y: TAGLIFT, duration: .35, ease: "expo.out" }, t + .02);
      }
      at([q("c2"), q("c3"), q("tag2"), q("tag3")], { opacity: 0 }, { opacity: 1, duration: .01, ease: "none" }, .90);
      slide("hero", "tag", X1 - HX, .90, 6);
      slide("c2", "tag2", X2 - HX, .98, 4);
      slide("c3", "tag3", X3 - HX, 1.06, 7);
      swing(q("tag"), .92, [0, -9, 5, -2.5, 0], .12);
      swing(q("tag2"), 1.00, [0, -5, 12, 7.5, 9], .12);
      swing(q("tag3"), 1.08, [0, 9, -2, 3.5, 2], .12);
      [["hero", 1.15], ["c2", 1.23], ["c3", 1.31]].forEach(function (p) {
        at(q(p[0] + "-head"), { y: 7 }, { y: 0, duration: .12, ease: "power3.out" }, p[1]);
        at(q(p[0] + "-eyes"), { y: 4 }, { y: 0, duration: .12, ease: "power3.out" }, p[1]);
      });

      // 1.35 la copie 2 retire sa cravate d'un geste (la copie 3 la suit à 0,08 s) ; 1.50 « 2 500 F »
      function yank(a, t) {
        K.spin(tl, q(a + "-arm"), 0, 45, t, .08, "power2.out");
        K.spin(tl, q(a + "-arm"), 45, -120, t + .08, .12, "expo.out");
        K.spin(tl, q(a + "-arm"), -120, 0, t + .25, .22, "power3.out");
        at(q(a + "-tie"), { x: 0, y: 0, rotation: 0, transformOrigin: "50% 0%" }, { x: 150, y: -260, rotation: 210, transformOrigin: "50% 0%", duration: .3, ease: "power3.out" }, t + .08);
        at(q(a + "-tie"), { opacity: 1 }, { opacity: 0, duration: .12, ease: "power1.in" }, t + .2);
      }
      yank("c2", 1.27);
      yank("c3", 1.35);
      roll("tag2", "", "1", 1.50);
      swing(q("tag2"), 1.50, [9, 14, 6, 10.5, 9], .1);
      roll("tag3", "", "1", 1.58);
      swing(q("tag3"), 1.58, [2, 7, -1.5, 3.5, 2], .1);

      // 2.00 la copie 3 enfile des claquettes bleues ; 2.15 « 1 500 F »
      at(q("c3-head"), { y: 0 }, { y: 8, duration: .12, ease: "power3.out" }, 1.80);
      at(q("c3-eyes"), { y: 0 }, { y: 5, duration: .12, ease: "power3.out" }, 1.80);
      at(q("c3"), { y: 0 }, { y: -22, duration: .07, ease: "power2.out" }, 1.93);
      at(q("c3"), { y: -22 }, { y: 0, duration: .1, ease: "power2.in" }, 2.00);
      at(q("c3-shoes"), { opacity: 1 }, { opacity: 0, duration: .02, ease: "none" }, 1.99);
      at(q("c3-flips"), { opacity: 0, scale: 1.5, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, transformOrigin: "50% 100%", duration: .12, ease: "expo.out" }, 1.99);
      roll("tag3", "1", "2", 2.15);
      swing(q("tag3"), 2.15, [2, -3, 5, .5, 2], .1);
      at(q("c3-head"), { y: 8 }, { y: 0, duration: .12, ease: "power3.out" }, 2.22);
      at(q("c3-eyes"), { y: 5 }, { y: 0, duration: .12, ease: "power3.out" }, 2.22);

      // couche vivante : les étiquettes se balancent doucement
      swing(q("tag"), 1.55, [0, 2.5, -2, 1.5, 0], .32);
      swing(q("tag2"), 2.0, [9, 11, 8, 9], .28);
      swing(q("tag3"), 2.55, [2, 3.5, 2], .15);

      // 2.40 le chauffeur hésite (le taxi avance de 10 px, s'arrête) ; 2.65 il repart, filé vers la droite, poussière
      at(q("taxi"), { x: 0, scaleX: 1, filter: "blur(0px)" }, { x: -12, scaleX: 1, filter: "blur(0px)", duration: .2, ease: "power2.out" }, 2.40);
      at(q("taxi-drv"), { x: 0 }, { x: -7, duration: .15, ease: "power2.out" }, 2.40);
      at(q("taxi-body"), { y: 0 }, { y: 5, duration: .05, ease: "power2.out" }, 2.58);
      at(q("taxi-body"), { y: 5 }, { y: 0, duration: .1, ease: "power2.inOut" }, 2.63);
      at(q("taxi"), { x: -12, scaleX: 1, filter: "blur(0px)" }, { x: 1500, scaleX: 1.12, filter: "blur(16px)", duration: .24, ease: "power2.in" }, 2.65);
      at(q("dust"), { opacity: 0, scale: .4, x: 0 }, { opacity: .8, scale: 1.1, x: -20, duration: .14, ease: "power2.out" }, 2.66);
      at(q("dust"), { opacity: .8, scale: 1.1, x: -20 }, { opacity: 0, scale: 1.7, x: -60, duration: .16, ease: "power1.in" }, 2.80);

      // 2.85 les trois héros se fondent en un seul à la place du milieu : le héros en costume (à gauche) et la copie 3 y glissent,
      // le héros lève la main ; son étiquette s'efface (la vignette « LUNDI » de 04 n'en a pas)
      function fuse(a, tg, dx0, rot0, keep) {
        at(q(a), { x: dx0, scaleX: 1, filter: "blur(0px)" }, { x: X2 - HX, scaleX: 1.08, filter: "blur(6px)", duration: .12, ease: "power3.in" }, 2.85);
        at(q(tg), { x: dx0, rotation: rot0 }, { x: X2 - HX, rotation: 0, duration: .12, ease: "power3.in" }, 2.85);
        if (keep) {
          at(q(a), { scaleX: 1.08, filter: "blur(6px)" }, { scaleX: 1, filter: "blur(0px)", duration: .08, ease: "power2.out" }, 2.97);
        } else {
          at(q(a), { opacity: 1 }, { opacity: 0, duration: .01, ease: "none" }, 2.97);
          at(q(tg), { opacity: 1 }, { opacity: 0, duration: .01, ease: "none" }, 2.97);
        }
      }
      fuse("hero", "tag", X1 - HX, 0, true);
      fuse("c3", "tag3", X3 - HX, 2, false);
      at([q("c2"), q("tag2")], { opacity: 1 }, { opacity: 0, duration: .01, ease: "none" }, 2.97);
      at(q("tag2"), { rotation: 9 }, { rotation: 0, duration: .12, ease: "power3.in" }, 2.85);
      K.spin(tl, q("hero-arm"), 0, -158, 2.88, .18);
      at(q("tag"), { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: .1, ease: "power2.in" }, 2.95);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
